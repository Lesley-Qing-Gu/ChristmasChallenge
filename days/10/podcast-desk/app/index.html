<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Podcast Desk</title>
<link rel="icon" href="/assets/logo.svg">
<style>
:root{
  /* 离岸 OutSea 配色：宝蓝 #143FDC · 绿 #01C366 · 橙 #C86B39 · 米 #D3CA9F */
  --sea:#143FDC; --sea2:#0f33b8; --green:#01C366; --orange:#C86B39; --sand:#D3CA9F;
  --bg:#e8e9ec; --paper:#ffffff; --chrome:#143FDC; --ink:#14181f; --ink2:#454b57; --muted:#8a90a0;
  --line:#e4e6ee; --hover:#f1f3fa; --press:#e6e9f5;
  --accent:#143FDC; --accent-ink:#ffffff; --accent-soft:#e3e9fd;
  --strike:#c25a26; --move:#00a557; --play:#efe8c6; --pend:#dce5ff;
  --shadow:0 1px 3px rgba(0,0,0,.12),0 4px 14px rgba(0,0,0,.06);
  --radius:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1b1c1f; --paper:#26272b; --chrome:#0e2585; --ink:#eef0f6; --ink2:#c2c8d8; --muted:#8890aa;
    --line:#26304f; --hover:#1a2444; --press:#202b50;
    --accent:#7d98ff; --accent-ink:#0b1440; --accent-soft:#1f2c5c;
    --strike:#f08a55; --move:#2fe08a; --play:#4a4426; --pend:#24356b;
    --shadow:0 2px 0 rgba(0,0,0,.3),0 12px 40px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  --bg:#1b1c1f; --paper:#26272b; --chrome:#0e2585; --ink:#eef0f6; --ink2:#c2c8d8; --muted:#8890aa;
  --line:#26304f; --hover:#1a2444; --press:#202b50;
  --accent:#7d98ff; --accent-ink:#0b1440; --accent-soft:#1f2c5c;
  --strike:#f08a55; --move:#2fe08a; --play:#4a4426; --pend:#24356b;
  --shadow:0 2px 0 rgba(0,0,0,.3),0 12px 40px rgba(0,0,0,.45);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased}
@font-face{font-family:'DotSong';src:url('/assets/dotsong.otf') format('opentype')}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
kbd{font:11.5px/1 ui-monospace,SFMono-Regular,Menlo,monospace;padding:3px 5px;border:1px solid var(--line);
  border-bottom-width:2px;border-radius:5px;background:var(--paper);color:var(--ink2);white-space:nowrap}

/* ---------- 顶栏 ---------- */
.top{position:sticky;top:0;z-index:20;background:var(--chrome);color:#fff}
.titlebar{display:flex;align-items:center;gap:12px;padding:10px 20px 6px}
.logo{width:34px;height:34px;flex:none;image-rendering:pixelated;display:block;box-shadow:0 0 0 2px rgba(255,255,255,.9)}
.title{display:flex;flex-direction:column;min-width:0;margin-right:auto}
.title b{font-family:'DotSong',monospace;font-size:21px;font-weight:400;letter-spacing:.12em;line-height:1.1}
.title b em{font-style:normal;color:var(--green)}
/* the dot-matrix font only covers the Chinese title; English uses a plain monospace */
html[lang="en"] .title b{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:18px;font-weight:700;letter-spacing:.06em}
html[lang="en"] .card .step{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.title span{font-size:12px;color:rgba(255,255,255,.7);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:rgba(255,255,255,.85);font-weight:600}
.iconbtn:hover{background:rgba(255,255,255,.12);color:#fff}
.primary{background:var(--green);color:#04210f;border-radius:8px;padding:7px 14px;font-weight:600;font-size:13.5px}
.primary:hover{filter:brightness(1.07)}
.primary:disabled{opacity:.5;cursor:default}

/* 功能区（像 Word 的 Ribbon） */
.ribbon{display:flex;align-items:stretch;gap:2px;padding:6px 14px 6px;overflow-x:auto;background:var(--paper);color:var(--ink);border-bottom:3px solid var(--sand)}
.group{display:flex;flex-direction:column;align-items:center;padding:0 8px;border-right:1px solid var(--line)}
.group:last-child{border-right:0}
.group .btns{display:flex;gap:2px}
.group .gl{font-size:11px;color:var(--muted);margin-top:2px;letter-spacing:.05em}
.rb{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:58px;padding:5px 6px 4px;border-radius:8px;color:var(--ink)}
.rb:hover{background:var(--hover)} .rb:active{background:var(--press)}
.rb:disabled{opacity:.35;cursor:default;background:none}
.rb .ic{height:22px;display:grid;place-items:center;font-size:16px}
.rb .lb{font-size:12px;white-space:nowrap}
.rb.on{background:var(--accent-soft);color:var(--accent)}
.spacer{flex:1}
.rb.danger:hover{color:var(--strike)}
.ic-del{font-weight:600;text-decoration:line-through;text-decoration-color:var(--strike);text-decoration-thickness:2px}
.ic-move{font-weight:600;color:var(--move);text-decoration:underline double;text-decoration-color:var(--move)}

/* 移动模式提示条 */
#banner{display:none;align-items:center;gap:12px;justify-content:center;padding:8px 16px;background:var(--pend);
  font-size:13.5px;border-top:1px solid var(--line)}
#banner.show{display:flex}
#banner button{border:1px solid currentColor;border-radius:6px;padding:2px 10px;font-size:12.5px;opacity:.8}

/* ---------- 纸张 ---------- */
main{padding:28px 16px 140px}
.paper{max-width:860px;margin:0 auto;background:var(--paper);border-radius:0;box-shadow:var(--shadow);
  padding:48px 56px 64px;min-height:70vh}
.docname{font-size:22px;font-weight:650;color:var(--accent);margin:0 0 4px;letter-spacing:.01em}
.docsub{color:var(--muted);font-size:13px;margin-bottom:28px;padding-bottom:16px;border-bottom:2px dashed var(--line)}
#doc{font-size:16.5px;line-height:2.05}
.line{display:flex;gap:18px;border-radius:6px;margin:0 -10px;padding:1px 10px}
.line:hover{background:var(--hover)}
.ts{flex:0 0 52px;text-align:right;color:var(--muted);font:11.5px/2.95 ui-monospace,SFMono-Regular,Menlo,monospace;
  cursor:pointer;user-select:none;opacity:.75}
.line:hover .ts{opacity:1}
.ts:hover{color:var(--accent)}
.txt{flex:1;min-width:0;overflow-wrap:anywhere}
.txt span{border-radius:2px}
.p{color:var(--muted);font-size:11px;padding:0 1px;user-select:none;vertical-align:1px}
/* 修订样式（像 Word）：删除 = 红色删除线，移动 = 绿色双下划线 */
.del{color:var(--strike);text-decoration:line-through;text-decoration-color:var(--strike);text-decoration-thickness:1.5px}
.moved{text-decoration:underline double;text-decoration-color:var(--move);text-underline-offset:4px;color:var(--move)}
.moved.del{text-decoration:line-through;color:var(--strike)}
.playing{background:var(--play)}
.pend{background:var(--pend)}
@keyframes blink{50%{box-shadow:none}}
.cur{box-shadow:inset 2px 0 0 var(--accent);animation:blink 1s step-end infinite}
.cur-end{box-shadow:inset -2px 0 0 var(--accent);animation:blink 1s step-end infinite}
body.hide-del .del{display:none}
body.hide-del .empty-line{display:none}
::selection{background:var(--accent-soft)}

/* ---------- 底部播放条 ---------- */
.player{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--chrome);color:#fff;border-top:3px solid var(--sand);
  display:flex;align-items:center;gap:14px;padding:10px 20px}
.playbtn{width:38px;height:38px;border-radius:50%;background:#fff;color:var(--sea);display:grid;place-items:center;flex:none}
.playbtn svg{width:16px;height:16px}
.time{font:12.5px ui-monospace,SFMono-Regular,Menlo,monospace;color:rgba(255,255,255,.9);white-space:nowrap;min-width:110px}
.bar{flex:1;height:6px;border-radius:3px;background:rgba(255,255,255,.22);position:relative;cursor:pointer}
.bar:hover{height:8px}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--green);width:0}
.stats{font-size:12px;color:rgba(255,255,255,.72);white-space:nowrap;display:flex;gap:12px}
.stats b{color:#fff;font-weight:600}
.dot{display:inline-block;width:7px;height:7px;border-radius:0;background:var(--green);margin-right:5px;vertical-align:1px}
.dot.busy{background:var(--sand)}

/* 提示 */
#toast{position:fixed;left:50%;bottom:76px;transform:translateX(-50%) translateY(10px);opacity:0;pointer-events:none;
  background:var(--ink);color:var(--paper);padding:8px 14px;border-radius:8px;font-size:13px;transition:.2s;z-index:30;
  max-width:min(90vw,640px);text-align:center}
#toast.show{opacity:1;transform:translateX(-50%)}

/* ---------- 教程 ---------- */
#tour{position:fixed;inset:0;z-index:50;display:none}
#tour.show{display:block}
#tour .shade{position:absolute;inset:0;background:rgba(6,16,70,.62)}
#tour .spot{position:absolute;border-radius:6px;box-shadow:0 0 0 9999px rgba(6,16,70,.62),0 0 0 3px var(--green);
  transition:all .25s ease;pointer-events:none}
.card{position:absolute;width:min(380px,calc(100vw - 32px));background:var(--paper);color:var(--ink);border-radius:14px;
  box-shadow:0 20px 50px rgba(0,0,0,.3);padding:20px 22px 16px;transition:top .25s,left .25s}
.card .step{font-family:'DotSong',monospace;font-size:13px;color:var(--accent);font-weight:600;letter-spacing:.04em}
.card h3{margin:4px 0 8px;font-size:17px}
.card p{margin:0 0 10px;color:var(--ink2);font-size:14px;line-height:1.7}
.demo{background:var(--bg);border-radius:8px;padding:10px 12px;font-size:15px;line-height:1.9;margin:4px 0 12px}
.demo .del{color:var(--strike)}
.keys{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:13px;color:var(--ink2);margin:6px 0 12px;align-items:center}
.card .nav{display:flex;align-items:center;gap:8px;margin-top:6px}
.card .skip{color:var(--muted);font-size:13px;margin-right:auto}
.card .skip:hover{color:var(--ink)}
.card .prev{font-size:13.5px;padding:7px 12px;border-radius:8px;color:var(--ink2)}
.card .prev:hover{background:var(--hover)}
.dots{display:flex;gap:4px;margin-right:6px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--accent)}

/* 说话人 */
.spk{flex:none;width:9px;height:9px;border-radius:50%;margin:13px -8px 0 -6px;cursor:default}
.spk.same{}
.legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:3px 10px;border:1px solid var(--line);border-radius:999px;cursor:pointer;color:var(--ink2)}
.chip:hover{border-color:var(--accent);color:var(--ink)}
.chip i{width:9px;height:9px;border-radius:50%}
/* 功能区里的输入框 */
.gapbox{display:flex;flex-direction:column;align-items:center;gap:3px;padding:3px 6px 0}
.gapbox .row{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--ink2)}
.gapbox input{width:66px;padding:3px 6px;border:1px solid var(--line);border-radius:6px;font:13px ui-monospace,Menlo,monospace;background:var(--paper);color:var(--ink);text-align:right}
.gapbox input:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
.gapbox .lb{font-size:12px}
#gTools{display:flex}
/* 弹窗 */
#modal{position:fixed;inset:0;z-index:45;display:none;background:rgba(6,16,70,.45);place-items:center}
#modal.show{display:grid}
.mcard{width:min(680px,94vw);max-height:86vh;overflow:auto;background:var(--paper);color:var(--ink);border-radius:14px;
  box-shadow:0 20px 60px rgba(0,0,0,.3);padding:22px 24px 18px}
.mcard h3{margin:0 0 4px;font-size:18px}
.mcard .sub{color:var(--muted);font-size:13px;margin-bottom:14px}
.mcard .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;align-items:center}
.mcard .acts .ghost{padding:7px 12px;border-radius:8px;color:var(--ink2)}
.mcard .acts .ghost:hover{background:var(--hover)}
.ftable{width:100%;border-collapse:collapse;font-size:14px}
.ftable td{padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.ftable td.n{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink2);white-space:nowrap}
.ftable td.ex{color:var(--muted);font-size:12.5px}
.ftable td.ex b{color:var(--strike);font-weight:600}
.ftable label{display:flex;gap:8px;align-items:center;cursor:pointer;font-weight:600}
.addrow{display:flex;gap:8px;margin-top:10px}
.addrow input,.field input,.field select{flex:1;padding:7px 10px;border:1px solid var(--line);border-radius:8px;font:inherit;background:var(--paper);color:var(--ink)}
.addrow button,.btn2{padding:7px 12px;border:1px solid var(--line);border-radius:8px}
.addrow button:hover,.btn2:hover{border-color:var(--accent)}
.mdtext{width:100%;min-height:52vh;font:13.5px/1.7 ui-monospace,SFMono-Regular,Menlo,monospace;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);resize:vertical}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:rot 1s linear infinite;vertical-align:-2px;margin-right:8px}
@keyframes rot{to{transform:rotate(360deg)}}
/* 音质分组 + A/B 对比条 */
.qbox{display:flex;flex-direction:column;gap:3px;padding:2px 4px 0;font-size:12px;color:var(--ink2)}
.qbox label{display:flex;align-items:center;gap:4px;justify-content:space-between}
.qbox select{font-family:inherit;font-size:12px;padding:2px 4px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink)}
#ab{position:fixed;left:50%;bottom:74px;transform:translateX(-50%);z-index:25;display:none;align-items:center;gap:12px;
  background:var(--paper);color:var(--ink);border-radius:12px;box-shadow:0 10px 36px rgba(0,0,0,.22);padding:10px 14px;
  border:2px solid var(--accent);max-width:calc(100vw - 24px);flex-wrap:wrap}
#ab.show{display:flex}
#ab .ttl{font-size:12.5px;color:var(--muted);white-space:nowrap}
.seg2{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg2 button{padding:6px 12px;font-size:13px;white-space:nowrap}
.seg2 button.on{background:var(--accent);color:#fff}
#ab .abplay{width:32px;height:32px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center}
#ab .abplay svg{width:13px;height:13px}
#ab .abbar{width:140px;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
#ab .abbar i{display:block;height:100%;width:0;background:var(--green)}
#ab .x{color:var(--muted);font-size:18px;padding:0 4px}
/* 首页 */
body.home .editor-only{display:none!important}
body:not(.home) .home-only{display:none!important}
.home-wrap{max-width:900px;margin:0 auto;padding:32px 16px 80px}
.home-wrap h2{font-size:15px;color:var(--ink2);margin:28px 0 12px;font-weight:600}
.uploader{background:var(--paper);border-radius:12px;box-shadow:var(--shadow);padding:22px 24px}
.drop{border:2px dashed var(--line);border-radius:10px;padding:26px;text-align:center;color:var(--muted);cursor:pointer;margin-bottom:14px}
.drop:hover,.drop.over{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.drop b{color:var(--ink)}
.fields{display:grid;grid-template-columns:1fr 130px 90px;gap:12px;margin-bottom:12px}
.field{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--ink2)}
.check{display:flex;gap:8px;align-items:center;font-size:13.5px;color:var(--ink2);margin-bottom:14px}
.prog{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin:10px 0 6px}
.prog i{display:block;height:100%;background:var(--green);width:0;transition:width .3s}
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.pcard{background:var(--paper);border-radius:10px;box-shadow:var(--shadow);padding:14px 16px;cursor:pointer;border:2px solid transparent;text-align:left}
.pwrap{position:relative;display:flex}
.pwrap .pcard{flex:1;min-width:0}
.pdel{position:absolute;top:8px;right:8px;border:0;background:transparent;color:var(--muted);font-size:13px;cursor:pointer;padding:2px 8px;border-radius:6px;opacity:0;transition:opacity .15s}
.pwrap:hover .pdel,.pdel:focus{opacity:1}
.pdel:hover{background:var(--strike);color:#fff}
.pcard:hover{border-color:var(--accent)}
.pcard b{display:block;font-size:14.5px;margin-bottom:4px;word-break:break-all}
.pcard span{font-size:12px;color:var(--muted)}
.pcard .prog{margin:8px 0 2px}
@media (max-width:700px){
  .paper{padding:28px 18px 40px}
  .ts{flex-basis:40px}
  .stats{display:none}
  .group .gl{display:none}
}
</style>
</head>
<body>

<div class="top">
  <div class="titlebar">
    <img class="logo" src="/assets/logo.svg" alt="">
    <div class="title"><b data-i="brand"></b><span id="meta"></span></div>
    <button class="iconbtn" id="bLang" title="中文 / English" style="font-size:12.5px;width:auto;padding:0 8px"></button>
    <button class="iconbtn" id="bTheme" data-t="tTheme"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
    <button class="iconbtn" id="bHelp" data-t="tHelp">?</button>
    <button class="btn2 editor-only" id="bHome" data-t="tHome" data-i="projects" style="color:#fff;border-color:rgba(255,255,255,.4)"></button>
    <button class="primary editor-only" id="bExport" data-i="export"></button>
  </div>
  <div class="ribbon editor-only">
    <div class="group" id="gEdit">
      <div class="btns">
        <button class="rb" id="bDel" data-t="tDel"><span class="ic ic-del" data-i="icText"></span><span class="lb" data-i="del"></span></button>
        <button class="rb" id="bRes" data-t="tRes"><span class="ic"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg></span><span class="lb" data-i="restore"></span></button>
      </div>
      <div class="gl" data-i="gEdit"></div>
    </div>
    <div class="group" id="gMove">
      <div class="btns">
        <button class="rb" id="bCut" data-t="tCut"><span class="ic ic-move" data-i="icText"></span><span class="lb" data-i="cut"></span></button>
        <button class="rb" id="bPaste" data-t="tPaste" disabled><span class="ic"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 10l5 5-5 5"/><path d="M4 4v7a4 4 0 0 0 4 4h12"/></svg></span><span class="lb" data-i="paste"></span></button>
      </div>
      <div class="gl" data-i="gMove"></div>
    </div>
    <div class="group" id="gHist">
      <div class="btns">
        <button class="rb" id="bUndo" data-t="tUndo"><span class="ic"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></span><span class="lb" data-i="undo"></span></button>
        <button class="rb" id="bRedo" data-t="tRedo"><span class="ic"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14l5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg></span><span class="lb" data-i="redo"></span></button>
      </div>
      <div class="gl" data-i="gHist"></div>
    </div>
    <div class="group" id="gView">
      <div class="btns">
        <button class="rb" id="bHide" data-t="tHide"><span class="ic"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></span><span class="lb" data-i="hideDel"></span></button>
      </div>
      <div class="gl" data-i="gView"></div>
    </div>
    <div id="gTools">
      <div class="group">
        <div class="btns">

/* 根据保留的字算出播放/导出用的原始时间区间；时间上首尾相接的字合成一段。
   设了"句间停顿"时：每句话开头前的空白统一成这个长度——原来停得长就剪短，
   原来太短（或接口处没有空白）就从原音频里借一段真正安静的声音补上。 */
function layout(){
  ranges = [];
  const G = settings.gapMs == null ? null : settings.gapMs / 1000;
  const half = G == null ? 0 : (G + XF) / 2;    // 前一句尾、后一句头各留多少（剪辑点的交叉淡化会吃掉 XF）
  const rateOf = t => (t.k === 'w' && t.sp && settings.speed && settings.speed[t.sp]) || 1;   // 说话人语速
  const push = (s, t, p) => { ranges.push({s, e: t.e, toks: [p], rate: rateOf(t)}); t._r = ranges.length - 1; };
  const addQuiet = len => {
    if (len < 0.02) return;
    const q = quiet.find(([a, b]) => b - a >= len);
    if (q) ranges.push({s: q[0], e: q[0] + len, toks: [], quiet: true, rate: 1});
  };
  let prev = null;
  for (let p = 0; p < tokens.length; p++){
    const t = tokens[p];
    t._r = -1;
    if (t.d || (G != null && t.k === 'p')) continue;   // 统一句间停顿时，原来补的停顿片段不用了
    const last = ranges[ranges.length - 1];
    const contig = last && Math.abs(last.e - t.s) < 1e-3 && last.rate === rateOf(t);
    if (G != null && prev && prev.k === 'w' && t.k === 'w' && prev.seg !== t.seg) {
      const pe = prev.we ?? prev.e, ts = t.ws ?? t.s;
      if (contig) {
        const g = ts - pe;
        if (g > G + XF) { last.e = pe + half; push(ts - half, t, p); }
        else if (g < G - 0.02) { const m = (pe + ts) / 2; last.e = m; addQuiet(G - g + 2 * XF); push(m, t, p); }
        else { last.e = t.e; last.toks.push(p); t._r = ranges.length - 1; }
      } else {
        const endPrev = Math.min(pe + half, prev.e), startNext = Math.max(ts - half, t.s);
        last.e = Math.max(last.s, endPrev);
        const gap0 = (endPrev - pe) + (ts - startNext) - XF;
        if (gap0 < G - 0.02) addQuiet(G - gap0 + XF);
        push(startNext, t, p);
      }
    } else if (contig) { last.e = t.e; last.toks.push(p); t._r = ranges.length - 1; }
    else push(t.s, t, p);
    prev = t;
  }
  let out = 0;
  ranges.forEach((r, i) => { r.out = out; out += (r.e - r.s) / r.rate - (i < ranges.length - 1 ? XF : 0); });
  for (const t of tokens) t._o = t._r >= 0 ? ranges[t._r].out + Math.max(0, t.s - ranges[t._r].s) / ranges[t._r].rate : null;
  total = out;
  return out;
}

function fmt(sec){
  sec = Math.max(0, sec || 0); const m = Math.floor(sec / 60), s = Math.floor(sec % 60);
  return (m >= 60 ? Math.floor(m/60) + ':' + String(m%60).padStart(2,'0') : m) + ':' + String(s).padStart(2,'0');
}

/* 当前拖选的字（位置区间） */
function selection(){
  const sel = window.getSelection();

/* ---------- 光标 ---------- */

/* 从鼠标点下的位置读出光标在哪两个字之间 */

  cursor = s[0]; selAnchor = null;
  window.getSelection().removeAllRanges(); render(); save();
  toast(t(flag ? 'didDel' : 'didRes', {n}));
}
function startMove(){
  const s = selection(); if (!s) return toast(t('selectToMove'));
  pending = s.map(p => tokens[p].id);
  window.getSelection().removeAllRanges(); render();
  $('#bannerText').textContent = t('cutBanner', {n: s[1]-s[0]+1});
  $('#banner').classList.add('show');
  $('#bPaste').disabled = false;
}
function markPending(){
  const a = tokens.findIndex(t => t.id === pending[0]), b = tokens.findIndex(t => t.id === pending[1]);
  for (let p = a; p <= b; p++) spanAt(p)?.classList.add('pend');
}
function doPaste(){
  if (!pending) return toast(t('cutFirst'));
  // 像 Word：粘贴到光标处（光标在哪个字前面，就插到它前面）
  const target = caretPos();
  if (target == null) return toast(t('cursorFirst'));
  const a = tokens.findIndex(t => t.id === pending[0]), b = tokens.findIndex(t => t.id === pending[1]);
  if (target >= a && target <= b + 1) return toast(t('cursorInside'));
  commit();
  const block = tokens.splice(a, b - a + 1);
  block.forEach(t => t.m = true);
  const at = target > b ? target - block.length : target;
  tokens.splice(at, 0, ...block);
  pending = null; $('#banner').classList.remove('show'); $('#bPaste').disabled = true;
  render(); save(); setCaret(at + block.length);
  toast(t('moved', {n: block.length}));
}
function cancelMove(){ pending = null; $('#banner').classList.remove('show'); $('#bPaste').disabled = true; render(); }

let toastT;
function toast(s){ const t = $('#toast'); t.textContent = s; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 3200); }

function doUndo(){
  if (!undo.length) return toast(t('noUndo'));
  redo.push(snap()); restore(undo.pop()); render(); save(); toast(t('undone'));
}
function doRedo(){
  if (!redo.length) return toast(t('noRedo'));
  undo.push(snap()); restore(redo.pop()); render(); save(); toast(t('redone'));
}

/* ---------- 播放（按剪辑后的顺序跳着放原音频） ---------- */
function setPlayIcon(){ $('#bPlay').innerHTML = playing ? ICON_PAUSE : ICON_PLAY; }
function playFromToken(p){
  let q = p;
  while (q < tokens.length && tokens[q].d) q++;
  if (q >= tokens.length) return;
  curRange = tokens[q]._r; au.currentTime = tokens[q].s; au.playbackRate = ranges[curRange].rate; startPlay();
}
function seekOutput(T){
  if (!ranges.length) return;
  let i = ranges.findIndex((r, k) => k === ranges.length - 1 || ranges[k + 1].out > T);
  const r = ranges[i];
  curRange = i; au.currentTime = Math.min(r.e - 0.02, r.s + Math.max(0, T - r.out) * r.rate); au.playbackRate = r.rate;
  updatePlayhead();
}
function startPlay(){
  if (!ranges.length) return;
  if (curRange < 0 || curRange >= ranges.length) { curRange = 0; au.currentTime = ranges[0].s; }
  au.preservesPitch = true; au.playbackRate = ranges[curRange].rate;
  au.play(); playing = true; setPlayIcon();
  cancelAnimationFrame(rafId); rafId = requestAnimationFrame(tick);
}
function stopPlay(){ au.pause(); playing = false; setPlayIcon(); cancelAnimationFrame(rafId); }
function togglePlay(){
  if (playing) return stopPlay();
  const c = caretPos();
  if (c != null && c < tokens.length) playFromToken(c); else startPlay();
}
function outNow(){ const r = ranges[curRange]; return r ? r.out + (au.currentTime - r.s) / r.rate : 0; }
function updatePlayhead(){
  const t = curRange >= 0 ? outNow() : 0;
  $('#tCur').textContent = fmt(t);
  $('#barFill').style.width = (total ? Math.min(100, t / total * 100) : 0) + '%';
}
let lastHud = 0;
function tick(ts){
  if (!playing) return;
  const r = ranges[curRange], ct = au.currentTime;
  if (!r) return stopPlay();
  if (ct >= r.e - 0.015 || ct < r.s - 0.5) {
    curRange++;
    if (curRange >= ranges.length) { stopPlay(); curRange = -1; return; }
    au.currentTime = ranges[curRange].s; au.playbackRate = ranges[curRange].rate;
  } else {
    let hp = null;
    for (const p of r.toks) { const t = tokens[p]; if (t.s <= ct && ct < t.e) { hp = p; break; } }
    if (hp != null && hp !== lastHi) {
      spanAt(lastHi)?.classList.remove('playing');
      const sp = spanAt(hp); sp?.classList.add('playing'); lastHi = hp;
      if (sp) { const y = sp.getBoundingClientRect().top; if (y < 170 || y > innerHeight - 90) sp.scrollIntoView({block:'center'}); }
    }
  }
  if (ts - lastHud > 200) { updatePlayhead(); lastHud = ts; }
  rafId = requestAnimationFrame(tick);
}

// 用 e.code（物理按键）判断：开着中文输入法时 e.key 会变成 "Process"，快捷键就失灵了
window.addEventListener('keydown', e => {
  if ($('#tour').classList.contains('show')) {
    if (e.code === 'Escape') endTour(); else if (e.code === 'ArrowRight' || e.code === 'Enter') tourGo(1);
    else if (e.code === 'ArrowLeft') tourGo(-1);
    e.preventDefault(); return;
  }
  if ($('#modal').classList.contains('show')) { if (e.code === 'Escape') closeModal(); return; }
  if (!PID || ['INPUT', 'SELECT', 'TEXTAREA'].includes(e.target.tagName)) return;
  if (AB && $('#ab').classList.contains('show')) {
    if (e.code === 'KeyB' || e.code === 'KeyA') { e.preventDefault(); abSwitch(e.code === 'KeyA' ? 'a' : (AB.cur === 'a' ? 'b' : 'a')); return; }
    if (e.code === 'Space') { e.preventDefault(); abToggle(); return; }
    if (e.code === 'Escape') { closeAB(); return; }
  }
  const c = e.code, mod = e.metaKey || e.ctrlKey;
  if (mod && c === 'KeyZ') { e.preventDefault(); e.stopPropagation(); e.shiftKey ? doRedo() : doUndo(); return; }
  if (mod && c === 'KeyY') { e.preventDefault(); doRedo(); return; }
  if (mod && c === 'KeyX') { e.preventDefault(); startMove(); return; }   // 剪切（移动）
  if (mod && c === 'KeyV') { e.preventDefault(); doPaste(); return; }     // 粘贴到光标处
  if (mod) return;
  if (c === 'Space') { e.preventDefault(); togglePlay(); }
  else if (c === 'Delete' || c === 'Backspace') { e.preventDefault(); setDel(true, c === 'Backspace'); }
  else if (c === 'KeyR') { e.preventDefault(); setDel(false); }
  else if (c === 'KeyX') { e.preventDefault(); startMove(); }
  else if (c === 'KeyV') { e.preventDefault(); doPaste(); }
  else if (c === 'ArrowLeft' || c === 'ArrowRight') { e.preventDefault(); moveCursor(c === 'ArrowLeft' ? -1 : 1, e.altKey, e.shiftKey); }
  else if (c === 'Escape' && pending) cancelMove();
}, true);

/* ---------- 音质：降噪 / 音量，A/B 试听对比 ---------- */
const DEN_NAMES = {off: t('denOffN'), light: t('denLightN'), strong: t('denStrongN'), ai: t('denAI')};
const LEV_NAMES = {none: t('levNoneN'), loudnorm: t('levLoudN'), full: t('levFullN')};
const exportOpt = () => Object.assign({level: 'none', denoise: 'off'}, JSON.parse(store.get('te_export') || '{}'));
function syncQuality(){ const o = exportOpt(); $('#qDen').value = o.denoise; $('#qLev').value = o.level; }
['#qDen', '#qLev'].forEach(id => $(id).addEventListener('change', e => {
  store.set('te_export', JSON.stringify({denoise: $('#qDen').value, level: $('#qLev').value}));
  e.target.blur();
  if ($('#ab').classList.contains('show')) startAB();   // 对比条开着就按新设置重新生成
}));
/* 成品时间 T0 起 dur 秒，对应原音频的哪些片段 */
function sliceOut(T0, dur){
  layout();
  const out = [];
  for (const r of ranges) {
    const a = r.out, len = (r.e - r.s) / r.rate;   // len：在成品里占多长
    if (a + len <= T0) continue;
    if (a >= T0 + dur) break;
    const s = r.s + Math.max(0, T0 - a) * r.rate, e = r.s + Math.min(len, T0 + dur - a) * r.rate;
    if (e - s > 0.02) out.push(r.rate !== 1 ? [s, e, r.rate] : [s, e]);
  }
  return out;
}
let AB = null;   // {a: Audio, b: Audio, cur: 'a'|'b', raf}
function abStop(){ if (!AB) return; AB.a.pause(); AB.b.pause(); cancelAnimationFrame(AB.raf); }
function closeAB(){ abStop(); AB = null; $('#ab').classList.remove('show'); }
function abDraw(){
  const o = exportOpt(), playingAB = AB && !AB.a.paused;
  $('#ab').innerHTML = `<span class="ttl">${t('abTitle', {t: fmt(AB.t0)})}</span>
    <div class="seg2"><button id="abA" class="${AB.cur === 'a' ? 'on' : ''}">${t('abA')}</button>
      <button id="abB" class="${AB.cur === 'b' ? 'on' : ''}">B ${DEN_NAMES[o.denoise]} · ${LEV_NAMES[o.level]}</button></div>
    <button class="abplay" id="abP">${playingAB ? ICON_PAUSE : ICON_PLAY}</button>
    <div class="abbar"><i id="abFill"></i></div>
    <span class="ttl">${t('abHint')}</span>
    <button class="x" id="abX" title="${t('abClose')}">×</button>`;
  $('#abA').onclick = () => abSwitch('a'); $('#abB').onclick = () => abSwitch('b');
  $('#abP').onclick = abToggle; $('#abX').onclick = closeAB;
}
function abSwitch(which){
  if (!AB) return;
  const from = AB[AB.cur], to = AB[which];
  to.currentTime = from.currentTime;
  AB.cur = which; AB.a.muted = which !== 'a'; AB.b.muted = which !== 'b';
  abDraw();
}
function abToggle(){
  if (!AB) return;
  if (AB.a.paused) {
    if (AB.a.ended || AB.a.currentTime >= AB.a.duration - 0.05) { AB.a.currentTime = 0; AB.b.currentTime = 0; }
    AB.b.currentTime = AB.a.currentTime;
    AB.a.play(); AB.b.play();
    const loop = () => {
      if (!AB) return;
      const d = AB.a.duration || 20;
      $('#abFill') && ($('#abFill').style.width = (AB.a.currentTime / d * 100) + '%');
      if (Math.abs(AB.a.currentTime - AB.b.currentTime) > 0.08) AB[AB.cur === 'a' ? 'b' : 'a'].currentTime = AB[AB.cur].currentTime;
      if (AB.a.paused) return abDraw();
      AB.raf = requestAnimationFrame(loop);
    };
    AB.raf = requestAnimationFrame(loop);
  } else abStop();
  abDraw();
}
async function startAB(){
  stopPlay(); abStop();
  // 从光标处开始；没放光标就从当前播放位置 / 开头
  let t0 = 0;
  if (cursor != null) { let q = cursor; while (q < tokens.length && tokens[q].d) q++; if (q < tokens.length) { layout(); t0 = tokens[q]._o || 0; } }
  else if (curRange >= 0) t0 = outNow();
  const o = exportOpt();
  $('#ab').innerHTML = `<span class="ttl"><span class="spin"></span>${t('abMaking', {t: fmt(t0), ai: o.denoise === 'ai' ? t('abAI') : ''})}</span><button class="x" id="abX">×</button>`;
  $('#ab').classList.add('show'); $('#abX').onclick = closeAB;
  const res = await fetch(api('/api/preview'), {method: 'POST', body: JSON.stringify({ranges: sliceOut(t0, 20), ...o})});
  const j = await res.json();
  if (!res.ok) { $('#ab').innerHTML = `<span class="ttl">${esc(j.error)}</span><button class="x" id="abX">×</button>`; $('#abX').onclick = closeAB; return; }
  const a = new Audio(api('/preview', '&f=' + encodeURIComponent(j.a))), b = new Audio(api('/preview', '&f=' + encodeURIComponent(j.b)));
  const keep = AB ? AB.cur : 'b';
  AB = {a, b, cur: keep, t0};
  a.muted = keep !== 'a'; b.muted = keep !== 'b';
  await Promise.all([a, b].map(x => new Promise(r => { x.oncanplaythrough = r; x.onerror = r; x.load(); })));
  abDraw(); abToggle();
}
$('#bAB').onclick = startAB;
$('#bSpk').onclick = openSpeakers;

/* ---------- 一键清理口头词 ---------- */
/* filler words per transcript language: [word, ticked by default] */
const FILLERS = {
  zh: [['嗯', 1], ['啊', 1], ['呃', 1], ['额', 1], ['然后', 1], ['哦', 0], ['就是', 0], ['对的', 0], ['对对对', 0], ['那个', 0], ['其实', 0]],
  en: [['um', 1], ['uh', 1], ['erm', 1], ['hmm', 1], ['you know', 0], ['I mean', 0], ['like', 0], ['so', 0], ['actually', 0], ['basically', 0], ['kind of', 0]],
  sv: [['eh', 1], ['öh', 1], ['hmm', 1], ['liksom', 0], ['typ', 0], ['alltså', 0], ['asså', 0], ['ba', 0]],
  de: [['äh', 1], ['ähm', 1], ['hm', 1], ['also', 0], ['halt', 0], ['quasi', 0], ['sozusagen', 0]],
  fr: [['euh', 1], ['hum', 1], ['bah', 0], ['genre', 0], ['en fait', 0], ['du coup', 0], ['voilà', 0]],
  es: [['eh', 1], ['em', 1], ['mmm', 1], ['o sea', 0], ['este', 0], ['bueno', 0], ['pues', 0]],
  ja: [['えー', 1], ['あの', 1], ['えっと', 1], ['まあ', 0], ['なんか', 0]],
  other: [['um', 1], ['uh', 1], ['eh', 1], ['hmm', 1]],
};
let fillerList = null;
const norm = s => s.toLowerCase().replace(/[\s，。、！？,.!?…~～:：;；"“”'‘’（）()\-]/g, '');
/* hesitation sounds come in many spellings: umm = um, hmmm = hm, uhh = uh */
const HES = /^(u+m+|u+h+|e+r+m*|h+m+|m+|e+h+|ö+h+|ä+h+m*|e+u+h+|a+h+)$/;
const squash = s => s.replace(/(.)\1+/g, '$1');
const sameWord = (x, w) => x === w || (HES.test(w) && HES.test(x) && squash(x) === squash(w));
/* 在保留的文字里找某个词：必须正好落在字的边界上；单字（嗯/啊…）也匹配"嗯嗯"这种叠字 */
function findPhrase(word){
  const w = norm(word); if (!w) return [];
  const K = []; tokens.forEach((t, p) => { if (!t.d && t.k === 'w') K.push(p); });
  const hits = [];
  for (let i = 0; i < K.length; i++) {
    const t0 = tokens[K[i]], x0 = norm(t0.t);
    if (w.length === 1) { if (x0 && [...x0].every(c => c === w)) hits.push([K[i]]); continue; }
    if (sameWord(x0, w)) { hits.push([K[i]]); continue; }
    let acc = '', j = i; const ps = [];
    while (j < K.length && acc.length < w.length && tokens[K[j]].seg === t0.seg) { acc += norm(tokens[K[j]].t); ps.push(K[j]); j++; }
    if (acc === w) { hits.push(ps); i = j - 1; }
  }
  return hits;
}
function example(ps){
  const a = ps[0], b = ps[ps.length - 1], ctx = (lo, hi) => joinWords(tokens.slice(lo, hi).filter(t => !t.d && t.k === 'w').map(t => t.t));
  const sp = LAT_START.test(tokens[a].t) ? ' ' : '';
  return esc(ctx(Math.max(0, a - 6), a)) + sp + '<b>' + esc(joinWords(ps.map(p => tokens[p].t))) + '</b>' + sp + esc(ctx(b + 1, b + 7));
}
function drawClean(){
  const rows = fillerList.map((f, i) => {
    const hits = findPhrase(f.w); f.n = hits.length;
    return `<tr><td><label><input type="checkbox" data-i="${i}" ${f.on ? 'checked' : ''}>${esc(f.w)}</label></td>
      <td class="n">${t('places', {n: hits.length})}</td><td class="ex">${hits.slice(0, 2).map(example).join('<br>') || '—'}</td></tr>`;
  }).join('');
  const total = fillerList.filter(f => f.on).reduce((a, f) => a + f.n, 0);
  openModal(`<h3>${t('cleanTitle')}</h3>
    <div class="sub">${t('cleanSub')}</div>
    <table class="ftable">${rows}</table>
    <div class="addrow"><input id="fAdd" placeholder="${esc(t('addWordPh'))}"><button id="fAddBtn">${t('add')}</button></div>
    <div class="acts"><button class="ghost" id="fCancel">${t('cancel')}</button><button class="primary" id="fGo" ${total ? '' : 'disabled'}>${t('cleanGo', {n: total})}</button></div>`);
  $('#mcard').querySelectorAll('input[type=checkbox]').forEach(cb => cb.onchange = () => { fillerList[+cb.dataset.i].on = cb.checked; drawClean(); });
  const add = () => { const v = $('#fAdd').value.trim(); if (norm(v) && !fillerList.some(f => norm(f.w) === norm(v))) fillerList.push({w: v, on: true}); drawClean(); };
  $('#fAddBtn').onclick = add;
  $('#fAdd').onkeydown = e => { if (e.key === 'Enter') add(); };
  $('#fCancel').onclick = closeModal;
  $('#fGo').onclick = () => {
    const all = fillerList.filter(f => f.on).flatMap(f => findPhrase(f.w));
    if (!all.length) return;
    commit(); all.flat().forEach(p => tokens[p].d = true);
    closeModal(); render(); save();
    toast(t('cleaned', {n: all.length}));
  };
}
$('#bClean').onclick = () => {
  const lang = ((window.META && window.META.lang) || '').split('-')[0];
  if (!fillerList) fillerList = (FILLERS[lang] || FILLERS.other).map(([w, on]) => ({w, on: !!on}));
  drawClean();
};

/* ---------- 生成 Shownote ---------- */
function transcriptForAI(){
  layout();
  const lines = []; let cur = null;
  for (const t of tokens) {
    if (t.d || t.k !== 'w') continue;
    if (!cur || cur.seg !== t.seg) { cur = {seg: t.seg, o: t._o, sp: {}, text: ''}; lines.push(cur); }
    cur.text += (cur.text && LAT_END.test(cur.text) && LAT_START.test(t.t) ? ' ' : '') + t.t; if (t.sp) cur.sp[t.sp] = (cur.sp[t.sp] || 0) + 1;
  }
  return lines.map(l => {
    const sp = Object.keys(l.sp).sort((a, b) => l.sp[b] - l.sp[a])[0];
    return `${fmt(l.o)} [${sp ? spName(sp) : '?'}] ${l.text}`;
  }).join('\n');
}
async function startShownote(){
  openModal(`<h3>${t('snTitle')}</h3><div class="sub"><span class="spin"></span>${t('snWriting')}</div>
    <div class="acts"><button class="ghost" id="sClose">${t('snBg')}</button></div>`);
  $('#sClose').onclick = closeModal;
  const res = await fetch(api('/api/shownote'), {method: 'POST', body: JSON.stringify({transcript: transcriptForAI()})});
  if (!res.ok && res.status !== 409) return openModal(`<h3>${t('snTitle')}</h3><div class="sub">${esc((await res.json()).error)}</div>`);
  pollShownote();
}
async function pollShownote(){
  const j = await (await fetch(api('/api/job', '&kind=shownote'))).json();
  if (j.state === 'running') return setTimeout(pollShownote, 2000);
  $('#bShow .lb').textContent = t('shownote');
  if (j.state === 'error') return openModal(`<h3>${t('snTitle')}</h3><div class="sub">${esc(j.msg)}</div><div class="acts"><button class="primary" id="sClose">${t('gotIt')}</button></div>`), ($('#sClose').onclick = closeModal);
  if (j.state !== 'done') return;
  openModal(`<h3>${UILANG === 'zh' ? 'Shownote' : 'Show notes'}</h3><div class="sub">${esc(j.msg)} · ${t('snCheck')}</div>
    <textarea class="mdtext" id="sText">${esc(j.text)}</textarea>
    <div class="acts"><button class="ghost" id="sAgain">${t('again')}</button><button class="ghost" id="sClose">${t('close')}</button><button class="primary" id="sCopy">${t('copyAll')}</button></div>`);
  $('#sClose').onclick = closeModal;
  $('#sAgain').onclick = startShownote;
  $('#sCopy').onclick = async () => {
    try { await navigator.clipboard.writeText($('#sText').value); } catch (e) { $('#sText').select(); document.execCommand('copy'); }
    toast(t('copied'));
  };
}
$('#bShow').onclick = async () => {
  const j = await (await fetch(api('/api/job', '&kind=shownote'))).json();
  if (j.state === 'running') { $('#bShow .lb').textContent = t('generating'); return startShownote(); }
  startShownote();
};
$('#bHome').onclick = () => { location.href = '/'; };

/* ---------- 首页：项目列表 + 上传 ---------- */
let upFile = null;
function showHome(){
  document.body.classList.add('home');
  document.title = t('brand').replace(/<[^>]+>/g, '');
  $('#meta').textContent = t('allProjects');
  refreshProjects();
}
async function refreshProjects(){
  const list = await (await fetch('/api/projects')).json();
  $('#plist').innerHTML = list.map(p => {
    const j = p.job, run = j && j.state === 'running', err = j && j.state === 'error';
    return `<div class="pwrap"><button class="pcard" data-id="${esc(p.id)}" ${run ? 'disabled' : ''}><b>${esc(p.id)}</b>
      ${run ? `<div class="prog"><i style="width:${Math.round((j.pct || 0) * 100)}%"></i></div><span>${esc(j.step || t('processing'))}</span>`
            : err ? `<span style="color:var(--strike)">${esc(j.msg || t('failed'))}</span>`
            : `<span>${p.edited ? t('edited') : t('notEdited')}${j && j.warn ? ' · ' + esc(j.warn) : ''} · ${new Date(p.mtime * 1000).toLocaleString(UILANG === 'zh' ? 'zh-CN' : 'en-GB', {month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit'})}</span>`}</button><button class="pdel" data-id="${esc(p.id)}" ${run ? 'disabled style="display:none"' : ''}>删除</button></div>`;
  }).join('') || `<div style="color:var(--muted)">${t('noProjects')}</div>`;
  $('#plist').querySelectorAll('.pcard').forEach(c => c.onclick = () => { location.href = '/?p=' + encodeURIComponent(c.dataset.id); });
  $('#plist').querySelectorAll('.pdel').forEach(b => b.onclick = async e => {
    e.stopPropagation();
    const id = b.dataset.id;
    if (!confirm(t('confirmDelete', {id}))) return;
    const r = await fetch('/api/delete?p=' + encodeURIComponent(id), {method: 'POST'});
    if (!r.ok) alert((await r.json()).error || t('deleteFailed'));
    refreshProjects();
  });
  if (list.some(p => p.job && p.job.state === 'running')) setTimeout(refreshProjects, 2000);
}
function pickFile(f){
  if (!f) return;
  upFile = f;
  $('#drop').innerHTML = `<b>${esc(f.name)}</b><br><span style="font-size:12px">${t('dropPicked', {size: (f.size / 1048576).toFixed(1)})}</span>`;
  if (!$('#pname').value) $('#pname').value = f.name.replace(/\.[^.]+$/, '').replace(/[-_\s]+\d{6,}.*$/, '');
  $('#bUpload').disabled = false;
}
$('#drop').onclick = () => $('#file').click();
$('#file').onchange = e => pickFile(e.target.files[0]);
$('#drop').ondragover = e => { e.preventDefault(); $('#drop').classList.add('over'); };
$('#drop').ondragleave = () => $('#drop').classList.remove('over');
$('#drop').ondrop = e => { e.preventDefault(); $('#drop').classList.remove('over'); pickFile(e.dataTransfer.files[0]); };
$('#bUpload').onclick = () => {
  if (!upFile) return;
  store.set('te_plang', $('#plang').value);
  const q = new URLSearchParams({name: $('#pname').value.trim(), filename: upFile.name, speakers: $('#pspk').value, lang: $('#plang').value, cut: $('#pcut').checked ? '1' : '0'});
  const xhr = new XMLHttpRequest();
  xhr.open('POST', '/api/upload?' + q);
  $('#bUpload').disabled = true; $('#upStatus').style.display = 'block';
  xhr.upload.onprogress = e => { if (e.lengthComputable) { $('#upBar').style.width = (e.loaded / e.total * 100) + '%'; $('#upText').textContent = t('uploading', {pct: Math.round(e.loaded / e.total * 100)}); } };
  xhr.onload = () => {
    if (xhr.status !== 200) { $('#upText').textContent = t('upFailed'); $('#bUpload').disabled = false; return; }
    const id = JSON.parse(xhr.responseText).id;
    $('#upText').textContent = t('upDone', {id});
    upFile = null; $('#drop').innerHTML = t('dropHtml'); $('#pname').value = '';
    refreshProjects();
  };
  xhr.onerror = () => { $('#upText').textContent = t('upLost'); $('#bUpload').disabled = false; };
  xhr.send(upFile);
};

/* ---------- 启动 ---------- */
function load(ts, u = [], r = []){
  tokens = ts; byId = new Map(tokens.map(t => [t.id, t]));
  undo = (u || []).filter(s => s && s.o); redo = (r || []).filter(s => s && s.o);
  render();
}
(() => { const th = store.get('te_theme'); if (th) document.documentElement.dataset.theme = th; })();
// 截图检查用：地址加 #notrans 关掉动画
if (location.hash.includes('notrans')) document.head.insertAdjacentHTML('beforeend', '<style>*{transition:none!important;animation:none!important}</style>');
applyStatic();
{ const pl = store.get('te_plang'); $('#plang').value = pl != null ? pl : (UILANG === 'zh' ? 'zh' : 'en'); }
$('#bLang').onclick = () => { store.set('te_ui', UILANG === 'zh' ? 'en' : 'zh'); location.reload(); };
setPlayIcon();
if (!PID) showHome();
else {
  au.src = api('/audio');
  fetch(api('/api/quiet')).then(r => r.json()).then(q => { quiet = q; if (settings.gapMs != null && tokens.length) render(); });
  fetch(api('/api/doc')).then(r => r.json()).then(d => {
    if (d.error) { toast(d.error); return showHome(); }
    window.META = d.meta;
    SPK = d.speakers || SPK;
    settings = Object.assign({gapMs: null, speed: {}}, d.settings || {});
    $('#gapMs').value = settings.gapMs ?? '';
    syncQuality();
    $('#meta').textContent = d.meta.id;
    $('#docname').textContent = d.meta.name;
    document.title = d.meta.name + ' · ' + t('brand').replace(/<[^>]+>/g, '');
    load(d.tokens, d.undo, d.redo);
    const m = location.hash.match(/tour=(\d+)/);
    if (m) setTimeout(() => { showTour(); tourI = +m[1]; tourDraw(); }, 300);
    else if (!store.get('te_tour_done') && !location.hash.includes('notour')) setTimeout(showTour, 300);
    if (location.hash.includes('open=clean')) setTimeout(() => $('#bClean').click(), 300);   // 截图检查用
    if (location.hash.includes('open=spk')) setTimeout(() => $('#bSpk').click(), 300);
  });
}
