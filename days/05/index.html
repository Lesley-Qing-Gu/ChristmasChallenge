<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Day 05 · MöleMe</title>
<meta name="description" content="Day 5 of Shipmas: a 3D office desk full of things to slack with, and a Windows 98 slacking terminal behind the screen. Work hard, slack harder.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,600;0,800;1,500&family=Caveat:wght@600&display=swap" rel="stylesheet">
<style>
/* Two layers: a 3D desk with a light HUD on top, and the MöleMe Win98 "OS" that fills the screen when you click the monitor. */
:root{--red:#e60012;--ink:#2a2420;--cream:#fffaf2;--line:#e5dccd;--muted:#7d7266}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:#1d1712;color:var(--ink);font-family:Inter,system-ui,sans-serif;overflow:hidden}
#stage{position:fixed;inset:0}
#stage canvas{display:block;width:100%;height:100%;cursor:grab;touch-action:none}

/* ---------- desk HUD ---------- */
.hud{position:fixed;z-index:5;transition:opacity .3s}
body.in-os .hud,body.in-os .toast,body.in-os .tip{opacity:0;pointer-events:none}
.bar{top:16px;left:16px;right:16px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;pointer-events:none}
.bar a{pointer-events:auto}
.chip{display:inline-flex;align-items:center;gap:6px;font-family:Unbounded,sans-serif;font-weight:600;font-size:12px;padding:8px 14px;border-radius:999px;text-decoration:none;transition:transform .15s}
.chip.back{background:var(--cream);color:var(--ink);border:1px solid var(--line)}
.chip.by{background:var(--red);color:#fff;box-shadow:0 4px 0 #0000002a}
.chip:hover{transform:translateY(-2px)}
.ttl{margin-top:14px}
.ttl p{margin:0;font-family:Unbounded,sans-serif;font-weight:600;font-size:11px;letter-spacing:.14em;color:#ffb36b}
.ttl h1{color:#fff6e6;text-shadow:0 2px 14px #0008;margin:4px 0 0;font-family:Unbounded,sans-serif;font-weight:800;font-size:clamp(28px,4.4vw,44px);line-height:1}
.ttl span{display:block;margin-top:6px;font-size:14px;color:#e8d7bf;text-shadow:0 1px 8px #000a}
.hint{left:50%;bottom:22px;transform:translateX(-50%);background:#fff6e6;color:var(--ink) !important;color:#fff;font-size:13px;font-weight:500;padding:10px 16px;border-radius:999px;white-space:nowrap;box-shadow:0 8px 20px -8px #0006}
.hint b{color:var(--red)}
.hint.gone{opacity:0;pointer-events:none}
.stats{left:16px;bottom:16px;background:var(--cream);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:12.5px;display:flex;flex-direction:column;gap:3px;min-width:200px;box-shadow:0 10px 24px -14px #0005}
.stats b{font-family:Unbounded,sans-serif;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--red);margin-bottom:3px}
.stats span{display:flex;justify-content:space-between;gap:16px;color:var(--muted)}
.stats i{font-style:normal;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.mute{right:16px;bottom:16px;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--cream);font-size:18px;cursor:pointer}
.tip{position:fixed;left:0;top:0;z-index:6;pointer-events:none;background:#fff;border:1px solid var(--line);color:var(--ink);font-size:12.5px;font-weight:600;padding:5px 10px;border-radius:8px;box-shadow:0 6px 16px -8px #0005;opacity:0;transition:opacity .12s}
.tip.on{opacity:1}
.toast{position:fixed;z-index:6;left:50%;top:22px;transform:translate(-50%,-14px);background:var(--ink);color:#fff;font-size:14px;font-weight:500;padding:10px 18px;border-radius:12px;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (max-width:700px){
  .ttl h1{font-size:28px}.ttl span{font-size:12px}
  .stats{min-width:0;font-size:11.5px;padding:10px 12px}
  .hint{bottom:178px;font-size:12px}
  .toast{top:auto;bottom:200px}
}

/* ---------- book reader ---------- */
#reader{position:fixed;inset:0;z-index:15;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:16px;background:#2a242099;backdrop-filter:blur(3px);opacity:0;transition:opacity .2s}
#reader.on{opacity:1}
#reader[hidden]{display:none}
.rd-book{display:grid;grid-template-columns:1fr 1fr;width:min(820px,100%);aspect-ratio:1.55;max-height:calc(100vh - 110px);background:#f7f1e3;border-radius:6px;box-shadow:0 30px 60px -20px #000a,inset 0 0 0 1px #0001;position:relative;perspective:1600px}
.rd-book::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:36px;margin-left:-18px;background:linear-gradient(90deg,transparent,#0000001f 45%,#00000030 50%,#0000001f 55%,transparent);pointer-events:none}
.rd-left,.rd-right{position:relative;overflow:hidden;min-height:0}
.rd-book.flip-r .rd-right,.rd-book.flip-l .rd-left{animation:flip .35s ease-out}
@keyframes flip{from{transform:rotateY(-14deg);opacity:.4}to{transform:none;opacity:1}}
.rd-page{height:100%;padding:clamp(18px,4vw,42px) clamp(18px,4vw,40px);font-family:Georgia,"Times New Roman",serif;color:#2a2420;font-size:clamp(13px,1.7vw,16.5px);line-height:1.65;overflow:auto;position:relative}
.rd-page h3{margin:0 0 12px;font-family:Unbounded,sans-serif;font-size:clamp(11px,1.3vw,13px);font-weight:600;letter-spacing:.06em;color:var(--red);text-transform:uppercase}
.rd-page p{margin:0 0 12px}
.rd-page .no{position:absolute;bottom:12px;left:0;right:0;text-align:center;font-size:11px;color:#a89a86}
.rd-cover{height:calc(100% - 20px);margin:10px 0 10px 10px;border-radius:4px 2px 2px 4px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:24px;gap:12px;box-shadow:inset -10px 0 18px -10px #0006}
.rd-cover small{font-family:Inter,sans-serif;font-size:12px;letter-spacing:.12em;text-transform:uppercase;opacity:.85}
.rd-cover h2{margin:0;font-family:Georgia,serif;font-size:clamp(20px,3.4vw,34px);line-height:1.15}
.rd-cover i{font-style:normal;font-size:22px;opacity:.8}
.rd-page.manual{display:flex;flex-direction:column;align-items:center;justify-content:center;background:#fff}
.rd-page.manual .step{width:100%;max-width:340px;height:auto}
.rd-page.manual .cap{margin:8px 0 0;font-family:Inter,sans-serif;font-size:13px;color:#666;text-align:center}
.manual-cover{background:#fff !important;color:#111 !important;border:6px solid #0058a3;box-shadow:none;margin:10px !important}
.manual-cover h2{font-family:Inter,Arial,sans-serif !important;font-weight:800;letter-spacing:.02em;font-size:clamp(26px,4vw,40px) !important}
.manual-cover small{color:#0058a3}
.manual-cover .parts{font-size:12px;color:#555;background:#ffda1a;padding:4px 10px;border-radius:3px}
.rd-nav{display:flex;align-items:center;gap:10px}
.rd-nav button{font:inherit;cursor:pointer;border:0;border-radius:999px;background:var(--cream);color:var(--ink);height:40px;min-width:40px;padding:0 14px;font-weight:600;box-shadow:0 4px 12px -6px #0006}
.rd-nav button:disabled{opacity:.4;cursor:default}
.rd-nav .rd-prev,.rd-nav .rd-next{font-size:22px;line-height:1;padding:0}
.rd-nav .rd-close{background:var(--red);color:#fff}
.rd-pg{color:#fff;font-size:13px;font-weight:600;min-width:46px;text-align:center}
@media (max-width:640px){ .rd-book{grid-template-columns:1fr;aspect-ratio:auto;height:min(560px,calc(100vh - 120px))} .rd-book::after{display:none} .rd-left:has(.rd-cover)~.rd-right,.rd-left:not(:has(.rd-cover)){display:block} .rd-book .rd-left{border-bottom:1px solid #0001} }

/* ---------- the desk puzzle ---------- */
.stats .fk{color:var(--red);font-weight:600}.stats .fk i{color:var(--red)}
#fcard{position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:16px;background:#1d171299;backdrop-filter:blur(3px);opacity:0;transition:opacity .18s}
#fcard.on{opacity:1}#fcard[hidden]{display:none}
.fc{position:relative;width:min(400px,100%);background:var(--cream);color:var(--ink);border-radius:18px;padding:26px 24px 22px;text-align:center;box-shadow:0 30px 60px -20px #000a}
.fc-x{position:absolute;top:10px;right:12px;width:32px;height:32px;border-radius:50%;border:0;background:transparent;font-size:22px;color:var(--muted);cursor:pointer}
.fc-k{margin:0 0 6px;font-family:Unbounded,sans-serif;font-weight:600;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--red)}
.fc h2,.fc h3{font-family:Unbounded,sans-serif;font-weight:800;margin:4px 0 10px}
.fc h3{font-size:18px}.fc p{margin:8px 0;font-size:14px;line-height:1.5;color:#4a3f36}
.fc .big{font-family:Georgia,serif;font-weight:700;font-size:84px;line-height:1;color:var(--red);margin:6px 0 10px}
.fc .big i,.tile i{font-style:normal;font-size:.32em;vertical-align:top;margin-left:2px}
.tiles{display:flex;justify-content:center;gap:8px;margin:12px 0 6px}
.tile{width:52px;height:60px;border-radius:10px;display:grid;place-items:center;font-family:Georgia,serif;font-weight:700;font-size:30px;background:#eee4d4;color:#b9a991;border:2px dashed #d7c7ad}
.tile.got{background:#fff;color:var(--red);border:2px solid var(--red)}
.fc.paper{background:#ffe36b;transform:rotate(-1.2deg)}
.fc.paper .riddle{font-family:"Comic Sans MS","Marker Felt",cursive;font-size:20px;color:#2a2420;line-height:1.45;margin:10px 0}
.fc.paper .small{font-size:12.5px;color:#5a4a1a}.fc.paper .tile{background:#fff6c2;border-color:#c9a92a}.fc.paper .tile.got{background:#fff}
.dials{display:flex;justify-content:center;gap:8px;margin:14px 0 4px}
.dial{width:56px;height:68px;border-radius:10px;border:2px solid #cdbb9f;background:#fff;text-align:center;font:700 32px Georgia,serif;color:var(--red);text-transform:uppercase}
.dial:focus{outline:none;border-color:var(--red);box-shadow:0 0 0 3px #e6001222}
.fc .msg{min-height:20px;font-size:13px;color:var(--red)}
.fc .row{display:flex;justify-content:center;gap:10px;margin-top:10px}
.fc .row button{font:600 14px Inter,sans-serif;border:0;border-radius:999px;padding:10px 18px;cursor:pointer;background:#eee4d4;color:var(--ink)}
.fc .row .go,.fc .row .copy{background:var(--red);color:#fff}
.fc.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
/* certificate: a diploma on cream paper with a guilloche frame */
.fc.certificate{width:min(620px,100%);background:transparent;box-shadow:none;padding:0}
.fc.certificate .fc-x{top:-6px;right:-6px;background:#fffaf0;box-shadow:0 4px 10px #0004;z-index:2;color:var(--ink)}
.paper{position:relative;background:#fffaf0;color:#2a2420;padding:38px 46px 30px;border-radius:4px;text-align:center;box-shadow:0 30px 60px -20px #000c;
  background-image:radial-gradient(circle at 30% 20%,#fff 0,transparent 60%),radial-gradient(circle at 80% 90%,#f6ead2 0,transparent 55%)}
.paper::before{content:"";position:absolute;inset:12px;border:2px solid #c99a52;pointer-events:none;
  -webkit-mask:linear-gradient(#000 0 0);background:none}
.paper::after{content:"";position:absolute;inset:18px;pointer-events:none;border:7px solid transparent;
  border-image:repeating-linear-gradient(45deg,#c99a52 0 2px,transparent 2px 6px,#b5121b55 6px 7px,transparent 7px 10px) 7}
.corner{position:absolute;width:30px;height:30px;border:3px solid #b5121b;z-index:1}
.corner.tl{top:8px;left:8px;border-right:0;border-bottom:0}.corner.tr{top:8px;right:8px;border-left:0;border-bottom:0}
.corner.bl{bottom:8px;left:8px;border-right:0;border-top:0}.corner.br{bottom:8px;right:8px;border-left:0;border-top:0}
.paper .ck{margin:0;font:600 11px Inter,sans-serif;letter-spacing:.32em;text-transform:uppercase;color:#a87b36}
.paper .lead{margin:14px 0 2px;font:italic 500 17px "Playfair Display",Georgia,serif;color:#5a4a3c}
.paper .lead em{font-style:italic;font-weight:600;color:#2a2420;border-bottom:1px solid #c99a52;padding:0 6px}
.paper h2{margin:4px 0 0;font:800 clamp(26px,5vw,38px)/1.08 "Playfair Display",Georgia,serif;color:#b5121b;letter-spacing:-.01em}
.paper .rule{display:flex;align-items:center;gap:12px;margin:14px auto 0;width:60%;color:#c99a52;font-size:12px}
.paper .rule::before,.paper .rule::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,#c99a52,transparent)}
.paper .stamp{display:flex;justify-content:center;gap:8px;margin:10px 0 6px}
.paper .stamp span{width:44px;height:50px;display:grid;place-items:center;font:800 26px "Playfair Display",Georgia,serif;color:#b5121b;border:2px solid #b5121b;border-radius:6px;background:#fff;box-shadow:inset 0 0 0 3px #fff,inset 0 0 0 4px #b5121b33;transform:rotate(var(--r,0deg))}
.paper .stamp span:nth-child(1){--r:-3deg}.paper .stamp span:nth-child(2){--r:2deg}.paper .stamp span:nth-child(3){--r:-1deg}.paper .stamp span:nth-child(4){--r:3deg}
.paper .def{margin:6px auto 0;max-width:380px;font:13.5px/1.55 Inter,sans-serif;color:#6b5a48}
.paper .foot{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:10px;margin-top:22px}
.paper dl{margin:0;display:flex;flex-direction:column;gap:4px;text-align:left}
.paper dl div{display:flex;gap:8px;align-items:baseline}
.paper dt{font:600 9.5px Inter,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#a87b36;width:76px;white-space:nowrap;flex:none}
.paper dd{margin:0;font:600 13px Inter,sans-serif;color:#2a2420;font-variant-numeric:tabular-nums}
.paper .seal{width:92px;height:auto;filter:drop-shadow(0 4px 6px #0003);margin-bottom:-8px}
.paper .sign{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.paper .sig{font:600 30px "Caveat",cursive;color:#1f3a7a;transform:rotate(-4deg);margin-right:10px}
.paper .sign .line{width:150px;height:1px;background:#2a2420}
.paper .sign small{font:11px Inter,sans-serif;color:#7d7266}
.fc.certificate .row{margin-top:16px}
@media (max-width:560px){ .paper{padding:30px 22px 24px} .paper .foot{grid-template-columns:1fr 1fr;grid-template-areas:"seal seal" "meta sign"} .paper .seal{grid-area:seal;justify-self:center;margin:0 0 6px} .paper dl{grid-area:meta} .paper .sign{grid-area:sign} .paper .sign .line{width:110px} }
.margin-clue{position:absolute;right:18px;top:16px;width:58px;height:58px;display:grid;place-items:center;font:700 30px Georgia,serif;color:#c8102e;border:3px solid #c8102e;border-radius:52% 48% 55% 45% / 48% 55% 45% 52%;transform:rotate(-8deg)}
.margin-clue i{position:absolute;right:-12px;top:-10px;font-style:normal;font-size:16px}

/* ---------- MöleMe, Win98 ---------- */
#os{position:fixed;inset:0;z-index:20;background:#008080;color:#000;font-family:"MS Sans Serif","Microsoft Sans Serif",Tahoma,Geneva,Verdana,sans-serif;font-size:12px;opacity:0;transform:scale(1.03);transition:opacity .25s,transform .25s;overflow:hidden;user-select:none}
#os.on{opacity:1;transform:none}
#os[hidden],#os [hidden]{display:none !important}
#os button{font:inherit;color:inherit;cursor:pointer}
.w98{background:#c0c0c0;border:2px solid;border-color:#fff #808080 #808080 #fff}
.in98{border:2px solid;border-color:#808080 #fff #fff #808080}
.b98{background:#c0c0c0;border:2px solid;border-color:#fff #808080 #808080 #fff;padding:3px 10px}
.b98:active,.b98.down{border-color:#808080 #fff #fff #808080;padding:4px 9px 2px 11px}
.b98:disabled{color:#808080;cursor:default}
.white{background:#fff}
.pad{padding:10px}
.os-icons{position:absolute;left:10px;top:10px;display:flex;flex-direction:column;gap:14px;width:84px}
.os-icon{display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:0;padding:6px 2px}
.os-icon .g{font-size:34px;line-height:40px;height:40px;filter:grayscale(1);transition:filter .15s}
.os-icon .l{color:#fff;font-size:11px;font-weight:bold;padding:1px 3px;white-space:nowrap}
.os-icon:hover .g{filter:none}.os-icon:hover .l,.os-icon:focus-visible .l{background:#000080}
.os-window{position:absolute;top:56px;left:50%;transform:translateX(-50%);min-width:320px;max-width:calc(100% - 24px);max-height:calc(100% - 120px);overflow:auto;z-index:3;box-shadow:4px 4px 0 #0004}
.os-title{display:flex;justify-content:space-between;align-items:center;background:linear-gradient(90deg,#000080,#1084d0);color:#fff;font-weight:bold;padding:3px 3px 3px 6px;margin:2px}
.os-title .x{width:20px;height:18px;padding:0;line-height:12px;font-weight:bold}
.os-body{padding:4px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px}
.row.gap{justify-content:flex-start}.row.end{justify-content:flex-end}
.small{font-size:11px}.bold{font-weight:bold}
.cap{font-size:11px;font-weight:bold;color:#444;margin:0 0 4px;display:block}
.note{font-size:10px;color:#808080;font-style:italic;margin:10px 0 0;text-align:center}
.sep{border-top:1px solid #c0c0c0;margin:12px 0 10px}
.timer{min-width:300px}
.lcd{margin:0;background:#000;color:#4ade80;font-family:"Courier New",monospace;font-size:36px;text-align:center;padding:6px}
.earn{color:#000080;font-size:17px}
.rank{background:#facc15;font-weight:bold;padding:1px 8px}
.timer input{flex:1;min-width:0;padding:3px 6px;font:inherit;font-size:13px;background:#fff}
.timer select{font:inherit;background:#fff;padding:2px}
.quests h3{margin:0 0 8px;text-decoration:underline;font-size:13px}
.quest{display:flex;align-items:center;gap:8px;padding:6px;margin-bottom:6px}
.quest .qi{font-size:20px}.quest .qt{flex:1;min-width:0}
.quest b{display:block;font-size:12px}.quest small{display:block;font-size:10px;color:#666;max-width:280px}
.quest .done{color:#166534;font-weight:bold}
.fish{background:#f3f4f6;min-width:330px;min-height:330px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;overflow:hidden;padding:28px 20px 18px}
.fish .prog{position:absolute;top:6px;left:8px;font-family:"Courier New",monospace;font-size:10px;color:#666}
.fishbox{position:relative;cursor:pointer}
.cushion{position:absolute;left:50%;bottom:-22px;transform:translateX(-50%);width:190px;height:58px;background:#ef4444;border:2px solid #eab308;background-image:repeating-linear-gradient(45deg,transparent 0 18px,#eab30866 18px 36px),repeating-linear-gradient(-45deg,transparent 0 18px,#eab30833 18px 36px)}
.woodfish{position:relative;width:200px;height:auto;display:block;filter:drop-shadow(0 8px 8px #0004);transition:transform 75ms}
.woodfish.hit{transform:scale(.9) translateY(4px)}
.fishbox:hover .woodfish:not(.hit){transform:scale(1.05)}
.mallet{position:absolute;right:-56px;top:-18px;transform-origin:bottom center;transition:transform 60ms}
.mallet i{display:block;width:8px;height:92px;background:#dcc4a3;border:1px solid #a66e38;border-radius:2px}
.mallet b{position:absolute;top:-14px;left:-12px;width:32px;height:32px;border-radius:50%;background:#fdfdfd;border:2px solid #ddd}
.mallet.hit{transform:rotate(-45deg)}
.fish .count{margin:46px 0 0;font-family:"Courier New",monospace;font-size:44px;font-weight:bold}
.fish .motto{margin:4px 0 0;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#666;font-weight:bold;text-align:center}
.merit{position:absolute;left:50%;top:26%;color:#1e3a8a;font-weight:bold;font-size:20px;pointer-events:none;animation:merit .85s ease-out forwards}
@keyframes merit{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-80px)}}
.recycle{min-width:340px;position:relative}
.recycle textarea{width:100%;height:120px;resize:none;font:inherit;padding:6px;transition:transform .4s,opacity .4s;background:#fff}
.recycle textarea.crumple{transform:scale(0) rotate(720deg);opacity:0}
.recycle .files{margin-top:10px;padding:8px}
.recycle .file{display:flex;align-items:center;gap:8px}
.recycle .file span{font-weight:bold}.recycle .file small{flex:1;color:#808080;font-size:10px}
.cluetxt{width:100%}.cluetxt pre{margin:4px 0 0;padding:6px;background:#ffffe0;border:1px solid #c0c0c0;font:12px "Courier New",monospace;white-space:pre-wrap}
.recycle .bin{text-align:center;font-size:36px;opacity:.45;filter:grayscale(1);margin-top:14px}
.paperball{position:absolute;left:50%;top:40%;width:30px;height:30px;border-radius:50%;background:#e5e7eb repeating-linear-gradient(45deg,transparent 0 2px,#9ca3af55 2px 4px);border:1px solid #9ca3af;animation:toss .8s ease-in forwards}
@keyframes toss{from{transform:translate(-50%,-50%) scale(1.2)}to{transform:translate(-50%,140px) scale(.2) rotate(360deg);opacity:0}}
.doodle{min-width:300px}
.doodle .warn{padding:6px;color:#dc2626;font-weight:bold;font-size:11px;margin-bottom:8px}
.memo{position:relative;overflow:hidden}
