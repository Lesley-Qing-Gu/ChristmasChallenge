<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#b07b4f" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="SmallTalk" />
<title>SmallTalk</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Sans+JP:wght@500;700&display=swap" rel="stylesheet" />
<style>
/* ---------- 主题变量 ---------- */
:root, body[data-theme=journal]{
  --frame:#b07b4f; --ring:#9a6840; --paper:#f8f0e7; --card:#fffaf4; --ink:#6b4e3a; --muted:#a08a78; --line:#eadccd;
  --pill:#ece0d4; --pill-on:#dccbbb; --accent:#e5876b; --accent-ink:#fff; --accent-soft:#fbe3da; --me:#f6e2d3;
  --good:#7cb26a; --warn:#e3a14f; --tip:#fbebb8; --tip-ink:#8a6420;
  --font:'Nunito','Noto Sans SC',system-ui,sans-serif; --title:'Nunito','Noto Sans SC',system-ui,sans-serif;
  --r:22px;
}
body[data-theme=nordic]{
  --frame:#faf8f3; --ring:transparent; --paper:#faf8f3; --card:#ffffff; --ink:#17233b; --muted:#6b7285; --line:#ece7dc;
  --pill:#efeadf; --pill-on:#ffffff; --accent:#1f4e9c; --accent-ink:#fff; --accent-soft:#eaf0fb; --me:#eaf0fb;
  --good:#2f7d5b; --warn:#a8641b; --tip:#fdf4d6; --tip-ink:#8a6a00;
  --font:'Inter','Noto Sans SC',system-ui,sans-serif; --title:'Inter','Noto Sans SC',system-ui,sans-serif;
  --r:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--frame);color:var(--ink);font:600 16px/1.55 var(--font);-webkit-font-smoothing:antialiased;overflow-x:hidden}
body[data-theme=nordic]{font-weight:400}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
button:disabled{cursor:not-allowed}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
p,h1,h2,h3,ul,ol{margin:0}
ul,ol{padding:0;list-style:none}
.hidden{display:none!important}
.muted{color:var(--muted)}
.small{font-size:14px}

/* ---------- 手账外壳 ---------- */
.app{position:relative;max-width:520px;min-height:100vh;margin:calc(14px + env(safe-area-inset-top)) auto 0;background:var(--paper);border-radius:30px 30px 0 0;padding:20px 18px calc(100px + env(safe-area-inset-bottom))}
.rings{position:absolute;top:-10px;left:34px;right:34px;display:flex;justify-content:space-between;pointer-events:none}
.rings i{width:10px;height:22px;border-radius:6px;background:var(--ring)}
body[data-theme=nordic] .app{margin-top:env(safe-area-inset-top);border-radius:0}
body[data-theme=nordic] .rings{display:none}
@media(min-width:560px){.app{margin-top:28px;border-radius:30px;min-height:calc(100vh - 56px);margin-bottom:28px}}

.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 2px 14px}
.brand{display:flex;align-items:center;gap:9px;font:900 19px/1 var(--title);letter-spacing:-.01em}
body[data-theme=nordic] .brand{font-weight:600}
.brand em{font-style:normal;color:var(--accent)}
.logo{width:28px;height:28px;border-radius:9px;background:#3d77c2;position:relative;overflow:hidden;flex:none}
.logo::before,.logo::after{content:'';position:absolute;background:#f5cf47}
.logo::before{left:8px;top:0;bottom:0;width:5px}.logo::after{top:11px;left:0;right:0;height:5px}
.date{font-size:13px;color:var(--muted);background:var(--pill);padding:5px 11px;border-radius:999px;white-space:nowrap}

.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--pill);border-radius:999px;padding:4px;margin-bottom:18px}
.seg button{padding:10px 8px;border-radius:999px;font-size:14px;font-weight:800;letter-spacing:.06em;color:var(--muted);min-height:44px}
body[data-theme=nordic] .seg button{font-weight:500;letter-spacing:0}
.seg button[aria-selected=true],.seg button[aria-checked=true]{background:var(--pill-on);color:var(--ink)}
body[data-theme=nordic] .seg button[aria-selected=true],body[data-theme=nordic] .seg button[aria-checked=true]{box-shadow:0 1px 3px rgba(23,35,59,.12)}

.hello{padding:0 2px 16px}
.hello h1{font:900 26px/1.25 var(--title)}
body[data-theme=nordic] .hello h1{font-weight:600}
.hello p{color:var(--muted);font-size:15px;margin-top:4px}

/* ---------- 场景卡片网格 ---------- */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px 14px}
.tile{display:grid;justify-items:center;text-align:center;gap:2px}
.tile .art{width:100%;aspect-ratio:1/.86;border-radius:var(--r);overflow:hidden;box-shadow:0 3px 0 rgba(107,78,58,.08);transition:transform .15s}
.tile:active .art{transform:scale(.96)}
@media(hover:hover){.tile:hover .art{transform:translateY(-2px)}}
.art svg{display:block;width:100%;height:100%}
svg.av{border-radius:50%;overflow:hidden;display:block}
.tile b{font:800 15px/1.25 var(--title);margin-top:8px}
body[data-theme=nordic] .tile b{font-weight:600}
.tile .sv{font-size:12px;color:var(--muted);font-weight:700}
.tile .count{font-size:12px;color:var(--muted)}
.tile .count.done{color:var(--good)}

/* ---------- 卡片与表单 ---------- */
.card{background:var(--card);border-radius:var(--r);padding:18px;box-shadow:0 2px 0 rgba(107,78,58,.06)}
body[data-theme=nordic] .card{border:1px solid var(--line);box-shadow:none}
.stack{display:grid;gap:14px}
.label{font-size:13px;font-weight:800;color:var(--muted);letter-spacing:.04em;margin-bottom:8px;display:block}
body[data-theme=nordic] .label{font-weight:600;text-transform:uppercase;font-size:12px;letter-spacing:.08em}
.field{width:100%;padding:13px 15px;border:2px solid var(--line);border-radius:16px;background:var(--paper);outline:none;font-size:16px;transition:.15s}
.field:focus{border-color:var(--accent);background:var(--card)}
.field::placeholder{color:#bfae9f}
.keylinks a,.about a{color:inherit;font-weight:700}
textarea.field{resize:vertical;min-height:120px;line-height:1.5}
.primary{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;border-radius:18px;background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:17px;box-shadow:0 3px 0 rgba(0,0,0,.12);transition:.15s}
body[data-theme=nordic] .primary{font-weight:600;box-shadow:none}
.primary:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.12)}
.primary:disabled{background:#d8cbbf;box-shadow:none}
body[data-theme=nordic] .primary:disabled{background:#c9d3e6}
.ghost{min-height:40px;padding:0 14px;border-radius:999px;background:var(--pill);font-size:14px;font-weight:800;color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{min-height:36px;padding:0 13px;border-radius:999px;background:var(--pill);font-size:14px;color:var(--ink)}

/* ---------- 底部弹层 ---------- */
.sheet-bg{position:fixed;inset:0;background:rgba(60,40,25,.35);z-index:40;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.sheet{width:100%;max-width:520px;max-height:92vh;overflow:auto;background:var(--paper);border-radius:28px 28px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom));animation:up .25s ease}
.grab{width:42px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 12px}
.sheet .art{height:150px;border-radius:var(--r);overflow:hidden;margin-bottom:14px}
.sheet-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:16px}
.sheet-head h2{font:900 22px/1.25 var(--title)}
body[data-theme=nordic] .sheet-head h2{font-weight:600}
.close{width:40px;height:40px;border-radius:50%;background:var(--pill);font-size:20px;line-height:1;flex:none}
.opt{margin-bottom:16px}
.opt .seg{margin:0}
.npcs{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}
.npcs::-webkit-scrollbar{display:none}
.npcs button{display:grid;justify-items:center;gap:4px;font-size:12px;color:var(--muted);flex:none;width:62px}
.npcs .av{width:56px;height:56px;border-radius:50%;box-shadow:0 0 0 3px transparent;transition:.15s}
.npcs button.on .av{box-shadow:0 0 0 3px var(--accent)}
.npcs button.on{color:var(--ink)}
.npcs .auto{display:grid;place-items:center;background:var(--pill);font-size:22px;font-weight:900;color:var(--ink)}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* ---------- 课程页 ---------- */
.backbar{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.backbar .t{flex:1;min-width:0;font:800 17px/1.3 var(--title);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.banner{height:150px;border-radius:var(--r);overflow:hidden;position:relative;margin-bottom:14px}
.banner .who{position:absolute;left:12px;bottom:12px;display:flex;align-items:center;gap:8px;background:rgba(255,250,244,.92);padding:5px 12px 5px 5px;border-radius:999px;font-size:14px}
.banner .who .av{width:34px;height:34px}
.chat{display:grid;gap:14px}
.msg{display:flex;gap:8px;align-items:flex-end}
.msg.me{flex-direction:row-reverse}
.msg .av{width:38px;height:38px;flex:none}
.bubble{max-width:84%;background:var(--card);border-radius:20px 20px 20px 6px;padding:11px 13px;box-shadow:0 2px 0 rgba(107,78,58,.06)}
body[data-theme=nordic] .bubble{border:1px solid var(--line);box-shadow:none}
.msg.me .bubble{background:var(--me);border-radius:20px 20px 6px 20px;border-color:transparent}
.brow{display:flex;gap:10px;align-items:flex-start}
.sv-line{flex:1;min-width:0;font-size:17px;line-height:1.45;font-weight:700;overflow-wrap:anywhere}
body[data-theme=nordic] .sv-line{font-weight:500}
.zh{margin-top:5px;font-size:14px;color:var(--muted);font-weight:500;overflow-wrap:anywhere}
.hide-zh .zh{display:none}
.speak{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);transition:.15s}
.speak svg{width:14px;height:14px}
.speak.playing{background:var(--accent);color:var(--accent-ink)}
.no-voice .speak{display:none}
.switch{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);cursor:pointer}
.switch input{accent-color:var(--accent);width:18px;height:18px}
.vocab{display:grid;gap:14px}
.vocab li{display:flex;gap:12px;align-items:flex-start}
.term{font-weight:800;color:var(--ink)}
body[data-theme=nordic] .term{font-weight:600}
.plain{display:grid;gap:10px}
.plain li{padding-left:18px;position:relative;font-weight:500}
.plain li::before{content:'';position:absolute;left:2px;top:.6em;width:8px;height:8px;border-radius:50%;background:var(--line)}
.plain.good li::before{background:var(--good)}
.plain.warn li::before{background:var(--warn)}
.tip{background:var(--tip);border-radius:var(--r);padding:18px}
.tip .label{color:var(--tip-ink)}
.tip p{font-weight:700;line-height:1.6}
.card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.card-head .label{margin:0}

/* ---------- 口语 ---------- */
.topic{text-align:center;padding:22px 18px}
.topic .av{width:84px;height:84px;margin:0 auto 6px}
.topic .name{font-size:13px;color:var(--muted);margin-bottom:12px}
.topic-sv{font:900 23px/1.3 var(--title);margin-bottom:6px}
body[data-theme=nordic] .topic-sv{font-weight:600}
.answer{text-align:left;display:grid;gap:12px;margin-top:20px}
.answer-tools{display:flex;justify-content:space-between;align-items:center}
.answer-tools .label{margin:0}
.mic{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-size:14px;font-weight:800}
.mic svg{width:16px;height:16px}
.mic.on{background:#d9534f;color:#fff;animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(217,83,79,.4)}70%{box-shadow:0 0 0 14px rgba(217,83,79,0)}100%{box-shadow:0 0 0 0 rgba(217,83,79,0)}}
.note{font-size:13px;color:var(--muted);font-weight:500;line-height:1.5}
.score{display:grid;gap:6px}
.score-top{display:flex;justify-content:space-between;font-weight:800}
.bar{height:14px;border-radius:999px;background:var(--pill);overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px;background:var(--good);transition:width .6s ease}
.bar.b2 i{background:var(--warn)}
.quote{font-weight:800;font-size:17px;line-height:1.5;border-left:4px solid var(--good);padding-left:12px;flex:1;min-width:0;overflow-wrap:anywhere}
body[data-theme=nordic] .quote{font-weight:500}

/* ---------- 设置 ---------- */
.theme-opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.theme-opts button{display:grid;gap:3px;justify-items:start;text-align:left;padding:10px;border-radius:18px;background:var(--paper);box-shadow:inset 0 0 0 2px var(--line)}
.theme-opts button[aria-pressed=true]{box-shadow:inset 0 0 0 3px var(--accent)}
.theme-opts small{color:var(--muted);font-size:12px;line-height:1.4;font-weight:500}
.sw{width:100%;height:60px;border-radius:12px;margin-bottom:6px}
.sw-journal{background:linear-gradient(#bfe3f2 0 50%,#a8d08d 50% 70%,#f8f0e7 70%);box-shadow:inset 0 0 0 5px #b07b4f}
.sw-nordic{background:linear-gradient(90deg,#faf8f3 0 60%,#1f4e9c 60% 76%,#f2c230 76%);box-shadow:inset 0 0 0 1px #ece7dc}
#caps li{font-size:15px}
.about{text-align:center;font-size:13px;color:var(--muted);margin-top:4px}

/* ---------- 底部导航 ---------- */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;pointer-events:none}
.tabbar-in{pointer-events:auto;width:100%;max-width:520px;display:grid;grid-template-columns:repeat(3,1fr);background:var(--card);border-top:2px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
@media(min-width:560px){.tabbar{bottom:28px}.tabbar-in{border-radius:0 0 30px 30px;border-top:2px solid var(--line)}}
.tabbar button{display:grid;justify-items:center;gap:2px;padding:9px 0 10px;min-height:60px;font-size:12px;font-weight:800;color:var(--muted)}
.tabbar svg{width:24px;height:24px}
.tabbar button[aria-selected=true]{color:var(--accent)}

.alert{display:flex;justify-content:space-between;align-items:center;gap:12px;background:#fde4df;color:#9b3a2c;padding:12px 16px;border-radius:16px;margin-bottom:14px;font-size:14px}
.alert button{font-size:20px;line-height:1;opacity:.6}
.spin{display:inline-block;animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.rise{animation:rise .35s ease both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(max-width:360px){.grid{gap:18px 10px}.tile b{font-size:14px}}

/* ===== 地铁图首页 ===== */
:root, body[data-theme=journal]{ --mapbg:#f3ece3; --maptext:#5d5148; --water:#bddcee; --stn:#6b625b; --done:#ffd25a; }
body[data-theme=nordic]{ --mapbg:#f2f3f5; --maptext:#4a4f5c; --water:#c4def0; --stn:#5c616b; --done:#f2c230; }
.langbtn{display:inline-flex;align-items:center;gap:6px;min-height:38px;padding:0 12px;border-radius:999px;background:var(--pill);font-size:14px;font-weight:800;white-space:nowrap}
body[data-theme=nordic] .langbtn{font-weight:600}
.langbtn .flag{font-size:17px;line-height:1}
.date{display:block;margin:-6px 2px 12px;background:none;padding:0}
.mapcard{background:var(--mapbg);border-radius:var(--r);padding:6px 4px;margin-bottom:16px;position:relative}
.mapcard svg{display:block;width:100%;height:auto}
.map-title{position:absolute;left:14px;top:12px;font:900 13px/1.3 var(--title);color:var(--muted);letter-spacing:.04em}
.map-legend{position:absolute;right:12px;top:12px;display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.map-legend i{width:12px;height:12px;border-radius:50%;background:var(--done);box-shadow:inset 0 0 0 2.5px var(--stn)}
.map-label{font:800 12px var(--font);fill:var(--maptext);paint-order:stroke;stroke:var(--mapbg);stroke-width:4px;stroke-linejoin:round}
body[data-theme=nordic] .map-label{font-weight:600}
.stn{cursor:pointer;outline:none}
.stn .ring{transition:transform .15s;transform-box:fill-box;transform-origin:center}
.stn:hover .ring,.stn:focus-visible .ring{transform:scale(1.25)}
.stn:focus-visible .hit{stroke:var(--accent);stroke-width:2.5}
.pulse{fill:none;stroke:var(--accent);stroke-width:2.5;transform-box:fill-box;transform-origin:center;animation:ping 1.8s ease-out infinite}
@keyframes ping{0%{transform:scale(.7);opacity:.9}100%{transform:scale(2);opacity:0}}
.lines{display:grid;gap:14px}
.line-card{background:var(--card);border-radius:var(--r);padding:14px 14px 6px;box-shadow:0 2px 0 rgba(107,78,58,.06)}
body[data-theme=nordic] .line-card{border:1px solid var(--line);box-shadow:none}
.line-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.line-name{display:inline-flex;align-items:center;gap:8px;font:900 16px var(--title)}
body[data-theme=nordic] .line-name{font-weight:600}
.line-name i{width:26px;height:10px;border-radius:9px;background:var(--c)}
.line-prog{font-size:13px;color:var(--muted)}
.stops li button{display:grid;grid-template-columns:28px 1fr auto;align-items:center;gap:10px;width:100%;text-align:left;min-height:56px;position:relative}
.stops li button::before{content:'';position:absolute;left:11px;top:0;bottom:0;width:6px;background:var(--c)}
.stops li:first-child button::before{top:50%}
.stops li:last-child button::before{bottom:50%}
.stops .dot{position:relative;z-index:1;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:inset 0 0 0 3.5px var(--stn);margin-left:4px}
.stops .done .dot{background:var(--done)}
.stops .nm{display:grid;line-height:1.3;padding:8px 0}
.stops .nm b{font-size:16px;font-weight:800}
body[data-theme=nordic] .stops .nm b{font-weight:600}
.stops .nm span{font-size:13px;color:var(--muted);font-weight:600}
.stops .st{font-size:13px;color:var(--muted);padding-right:4px}
.stops .done .st{color:var(--good);font-weight:800}
.custom-card{margin-top:14px}
.custom-row{display:flex;gap:8px}
.custom-row .field{flex:1;min-width:0}
.custom-row .primary{width:auto;padding:0 18px;min-height:50px;font-size:16px}
.lang-list{display:grid;gap:10px}
.lang-list button{display:grid;grid-template-columns:40px 1fr auto;align-items:center;gap:12px;text-align:left;padding:12px 14px;border-radius:18px;background:var(--card);box-shadow:inset 0 0 0 2px var(--line)}
.lang-list button[aria-pressed=true]{box-shadow:inset 0 0 0 3px var(--accent)}
.lang-list .flag{font-size:28px;line-height:1}
.lang-list b{display:block;font-size:17px}
.lang-list span{font-size:13px;color:var(--muted)}
.reading{font-size:13px;color:var(--muted);font-weight:600;margin-top:2px;overflow-wrap:anywhere}
.line-chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);margin-top:4px}
.line-chip i{width:18px;height:7px;border-radius:9px;background:var(--c)}

/* ===== 桌面网页布局（≥900px） ===== */
.desk-only{display:none}
.empty-eval{text-align:center;padding:40px 24px;color:var(--muted)}
.empty-eval .av{width:72px;height:72px;margin:0 auto 12px;opacity:.85}
.lesson-main,.lesson-side{display:grid;gap:14px;align-content:start}
@media(min-width:900px){
  body{font-size:16px}
  .app{max-width:1180px;margin:28px auto;padding:26px 40px 64px;border-radius:30px;min-height:calc(100vh - 56px)}
  body[data-theme=nordic] .app{margin-top:0;border-radius:0;max-width:1240px}
  .rings{left:90px;right:90px}
  .top{padding:4px 0 6px}
  .date{margin:0 2px 10px}
  .tabbar{position:absolute;top:56px;bottom:auto;left:0;right:0}
  body[data-theme=nordic] .tabbar{top:28px}

function setSpeak(id) {

  if (langId === SPEAK) setLang(Object.keys(LANGS).find((k) => k !== SPEAK));

/* ================= 生成对话 ================= */
async function generate(closeSheet) {
  const btn = $('#start'); btn.disabled = true; btn.innerHTML = `<span class="spin">◌</span> ${esc(t('arriving'))}`;
  const st = current, fb = feedbackLang();
  try {
    if (!sample) throw new Error('no sample');
    const level = opts.level === 'basic' ? L.levelBasic : LEVELS.find((l) => l.id === opts.level).prompt;
    const npcRule = `Choose the character who best fits the scenario and put its id in "npc". Options: ${Object.entries(CHARS).map(([k, c]) => `${k} (${npcName(k)}: ${c.hint})`).join('; ')}.`;
    const style = styleOf(opts.style);
    const scenePromise = st.custom && !st.svg ? makeScene(st).catch(() => null) : null;
    const lesson = await sample.json(
`You are a warm, expert ${L.english} language coach.
Write an authentic, practical, everyday dialogue in ${L.english}.

Setting: everyday life in ${L.cityNative}
Scenario: ${st.prompt}
Level: ${level}
Words to include if natural: ${opts.keywords || 'none'}

Rules:
- 6 to 8 turns. The learner's role is exactly "ME"; the other speaker's role is exactly "NPC". The NPC speaks first.
- ${npcRule}
- Speaking style of the other speaker: ${style.prompt}
- Use natural spoken fillers where they fit, such as: ${L.fillers}.
- Friendly and realistic for daily life in ${L.cityNative}. If the scenario is written in another language, interpret it and write the dialogue in ${L.english}.
- "text" is the line in ${L.english}. ${L.reading ? `"reading" is the full ${L.readingName} reading of the line.` : '"reading" is an empty string.'}
- "translation" is the line translated into ${fb}.
- Vocabulary notes, pronunciation tips and the cultural tip are written in ${fb}.${L.reading ? ` Vocabulary terms include the ${L.vocabReading} reading in brackets.` : ''}
- "title" is a very short name for the scenario (2 to 8 words), in Simplified Chinese ("zh") and in English ("en").

Reply with ONLY valid JSON of this exact shape:
{"npc":"<character id>",
 "title":{"zh":"","en":""},
 "dialogue":[{"role":"NPC","text":"","reading":"","translation":""}],
 "vocabulary":[{"term":"","translation":"","info":""}],
 "pronunciation":[{"term":"","explanation":""}],
 "culturalTip":""}
Give 4-6 vocabulary items and 2-3 pronunciation points.`, { cache: false });
    closeSheet(); showWhere(false);
    lesson._style = opts.style;
    if (st.custom && lesson.title) { saveTitles(st.custom, lesson.title); st.title = titleOf(st.custom); }
    const card = addPostcard(st, lesson);
    renderLesson(lesson, st);
    if (st.custom) { rememberMine(st.custom); $('#custom-input').value = ''; $('#custom-go').disabled = true; }
    progress[st.id] = (progress[st.id] || 0) + 1; store.set('sk-progress2', progress); renderPresets(); renderMine();
    if (scenePromise) scenePromise.then((svg) => {
      if (!svg) return; saveScene(st.custom, svg); st.svg = svg; card.svg = svg; saveDiary(); renderMine(); renderCalendar(); if (cardKey === todayKey()) showCard(cardKey);
      if (lastLesson && lastLesson.st === st) { const ban = $('#lesson-art'); if (ban) { ban.innerHTML = svg; ban.classList.add('fresh'); } }
    });
    calMonth = monthKey(todayKey()); renderCalendar(); justArrived = todayKey();
    showLesson(true);
  } catch (err) { closeSheet(); showError(errText(err)); }
}

function renderLesson(l, st) {
  lastLesson = { l, st };
  const npcId = CHARS[l.npc] ? l.npc : (CHARS[st.npc] ? st.npc : 'neighbor');
  lastLesson.style = l._style || 'normal';
  const npc = CHARS[npcId];
  const lines = l.dialogue || [];
  const isMe = (x) => ['me', 'du', 'you'].includes(String(x.role || '').trim().toLowerCase());
  const hasMe = lines.some(isMe);
  $('#lesson-title').textContent = st.custom ? titleOf(st.custom) : st.title;
  const chat = lines.map((x, i) => {
    const me = hasMe ? isMe(x) : i % 2 === 1, who = me ? PLAYER : npc, text = x.text || '';
    return `<li class="msg ${me ? 'me' : ''}">${avatar(who)}<div class="bubble"><div class="brow"><p class="sv-line">${esc(text)}</p>${speakBtn('l' + i, text, who.voice)}</div>
      ${x.reading ? `<p class="reading">${esc(x.reading)}</p>` : ''}<p class="zh">${esc(x.translation || x.chinese || '')}</p></div></li>`;
  }).join('');
  const voc = (l.vocabulary || []).map((v, i) => `<li>${speakBtn('v' + i, String(v.term).replace(/[（(].*?[)）]/g, ''), npc.voice)}<div><p><span class="term">${esc(v.term)}</span> <span class="muted">· ${esc(v.translation)}</span></p><p class="small muted">${esc(v.info)}</p></div></li>`).join('');
  const pro = (l.pronunciation || []).map((p) => `<li><span class="term">${esc(p.term)}</span> <span class="small">${esc(p.explanation)}</span></li>`).join('');
  $('#lesson').innerHTML = `<div class="stack rise" id="lesson-body"><div class="lesson-main">
    <div class="banner"><div class="banner-art" id="lesson-art">${artFor(st)}</div><div class="who">${avatar(npc)}<span>${esc(npcName(npcId))} · ${esc(loc(npc.title))} · ${esc(loc(styleOf(lastLesson.style).label))}</span></div></div>
    <div class="card"><div class="card-head"><span class="label">${esc(t('dialogue'))}</span><label class="switch"><input type="checkbox" id="hide-zh" /><span>${esc(t('hideTr'))}</span></label></div><ol class="chat">${chat}</ol></div>
    <div class="card fu-card"><span class="label">${esc(t('followTitle'))}</span><ol class="chat fu-list" id="fu-list">${followHTML(l, npc)}</ol>
      <div class="fu-input"><textarea id="fu-text" class="field" rows="2" placeholder="${esc(t('followPh', loc(L.name)))}"></textarea>
      <div class="fu-tools"><button type="button" class="mic hidden" id="fu-mic" data-compact="1"></button><button type="button" class="primary" id="fu-send" disabled>${esc(t('send'))}</button></div></div></div>
    </div><div class="lesson-side">
    ${voc ? `<div class="card"><span class="label">${esc(t('vocab'))}</span><ul class="vocab">${voc}</ul></div>` : ''}
    ${pro ? `<div class="card"><span class="label">${esc(t('pron'))}</span><ul class="plain">${pro}</ul></div>` : ''}
    <div class="tip"><span class="label">${esc(t('tip'))}</span><p>${esc(l.culturalTip)}</p></div></div></div>`;
  $('#hide-zh').onchange = (e) => $('#lesson-body').classList.toggle('hide-zh', e.target.checked);
  lastLesson.npcId = npcId;
  $('#fu-text').oninput = () => { $('#fu-send').disabled = !$('#fu-text').value.trim(); };
  $('#fu-text').onkeydown = (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); if (!$('#fu-send').disabled) $('#fu-send').click(); } };
  $('#fu-send').onclick = () => sendFollow(l, st);
  bindMic($('#fu-mic'), $('#fu-text'));
}
function followHTML(l, npc) {
  return (l.follow || []).map((f, i) => {
    let h = `<li class="msg me">${avatar(PLAYER)}<div class="bubble"><p class="sv-line">${esc(f.me)}</p>${f.corrected ? `<p class="fu-fix">${esc(t('moreNatural'))}<b>${esc(f.corrected)}</b></p>` : ''}${f.feedback ? `<p class="zh">${esc(f.feedback)}</p>` : ''}</div></li>`;
    if (f.mode === 'answer') h += `<li class="msg coach"><span class="av coach-av">💡</span><div class="bubble"><p class="small muted"><b>${esc(t('coach'))}</b></p><p class="coach-t">${esc(f.answer)}</p></div></li>`;
    else if (f.reply && f.reply.text) h += `<li class="msg">${avatar(npc)}<div class="bubble"><div class="brow"><p class="sv-line">${esc(f.reply.text)}</p>${speakBtn('f' + i, f.reply.text, npc.voice)}</div>${f.reply.reading ? `<p class="reading">${esc(f.reply.reading)}</p>` : ''}<p class="zh">${esc(f.reply.translation || '')}</p></div></li>`;
    return h;
  }).join('');
}
async function sendFollow(l, st) {
  const text = $('#fu-text').value.trim(); if (!text) return;
  clearError();
  const npcId = lastLesson.npcId, npc = CHARS[npcId], fb = feedbackLang(), style = styleOf(l._style || 'normal');
  const btn = $('#fu-send'); btn.disabled = true; btn.innerHTML = '<span class="spin">◌</span>';
  $('#fu-list').insertAdjacentHTML('beforeend', `<li class="msg me pending">${avatar(PLAYER)}<div class="bubble"><p class="sv-line">${esc(text)}</p></div></li><li class="msg pending">${avatar(npc)}<div class="bubble"><p class="typing"><i></i><i></i><i></i></p></div></li>`);
  $('#fu-list').lastElementChild.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  const isMe = (x) => ['me', 'du', 'you'].includes(String(x.role || '').trim().toLowerCase());
  const hist = (l.dialogue || []).map((x) => `${isMe(x) ? 'ME' : 'NPC'}: ${x.text}`)
    .concat((l.follow || []).flatMap((f) => [`ME: ${f.me}`].concat(f.mode === 'reply' && f.reply ? [`NPC: ${f.reply.text}`] : [`(the learner asked a question; the teacher answered: ${f.answer})`]))).join('\n');
  try {
    if (!sample) throw new Error('no sample');
    const r = await sample.json(
`You are helping someone practise ${L.english} through role-play, and you are also their friendly teacher.
Scenario: ${st.prompt || st.title} (everyday life in ${L.cityNative})
The other speaker (NPC) is ${npcName(npcId)}: ${CHARS[npcId].hint}. Speaking style: ${style.prompt}

Conversation so far (the learner is ME):
${hist}

The learner now wrote: """${text}"""

Decide what the learner is doing:
- If they continue the conversation in ${L.english} (even with mistakes): set "mode" to "reply". Write the NPC's next line in ${L.english}, in character, one or two short sentences that keep the conversation going. Put a more natural version of the learner's line in "corrected" (empty string if it is already natural) and one short sentence about the main mistake in "feedback", written in ${fb} (empty if none).
- If they ask a question about the language, this dialogue or the culture (in any language): set "mode" to "answer" and answer briefly and clearly in ${fb} in "answer", with short ${L.english} examples where useful. Leave "reply" empty.
"reply.reading" is ${L.reading ? `the full ${L.readingName} reading` : 'an empty string'}; "reply.translation" is the line in ${fb}.
Reply with ONLY valid JSON: {"mode":"reply","corrected":"","feedback":"","reply":{"text":"","reading":"","translation":""},"answer":""}`, { cache: false });
    const f = { me: text, mode: r && r.mode === 'answer' ? 'answer' : 'reply', corrected: (r && r.corrected) || '', feedback: (r && r.feedback) || '', reply: (r && r.reply) || null, answer: (r && r.answer) || '' };
    if (f.mode === 'reply' && !(f.reply && f.reply.text)) { if (f.answer) f.mode = 'answer'; else throw { code: 'bad_output' }; }
    (l.follow = l.follow || []).push(f); saveDiary();
    $('#fu-text').value = '';
  } catch (err) { showError(errText(err)); }
  $('#fu-list').innerHTML = followHTML(l, npc);
  const last = $('#fu-list').lastElementChild; if (last) last.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  btn.textContent = t('send'); btn.disabled = !$('#fu-text').value.trim();
}

let micT = null;
function micLabel(btn) { const on = btn.classList.contains('on'); btn.innerHTML = (on ? ICON.stop : ICON.mic) + (btn.dataset.compact ? '' : ' ' + esc(t(on ? 'stop' : 'dictate'))); btn.setAttribute('aria-label', t(on ? 'stop' : 'dictate')); }
function setupDictationLabel() { document.querySelectorAll('.mic').forEach((b) => { if (!b.classList.contains('hidden')) micLabel(b); }); }
function bindMic(btn, area) {
  if (!btn) return;
  if (!dict) { btn.classList.add('hidden'); return; }
  btn.classList.remove('hidden'); micLabel(btn);
  btn.onclick = () => {
    if (btn.classList.contains('on')) { dict.stop().catch(() => {}); return; }
    micT = { btn, area, base: area.value };
    dict.start(WEB ? undefined : { language: L.tts }).catch((e) => { if (e && e.code === 'not_granted') { document.querySelectorAll('.mic').forEach((x) => x.classList.add('hidden')); showError(t('errMicGrant')); } else if (e && e.code === 'unavailable') showError(t('errMicLang', loc(L.name))); });
  };
}
function setupDictation() {
  if (!dict) return;
  const join = (a, b) => (a && b ? a.replace(/\s+$/, '') + ' ' + b.replace(/^\s+/, '') : (a + b).trim());
  dict.onPartial(({ text }) => { if (micT) micT.area.value = join(micT.base, text); });
  dict.onFinal(({ text }) => { if (!micT) return; micT.base = join(micT.base, text); micT.area.value = micT.base; micT.area.dispatchEvent(new Event('input')); });
  dict.onState(({ state }) => {
    document.querySelectorAll('.mic.on').forEach((b) => { if (state === 'idle' || !micT || b !== micT.btn) { b.classList.remove('on'); micLabel(b); } });
    if (state === 'listening' && micT) { micT.btn.classList.add('on'); micLabel(micT.btn); }
    if (state === 'idle') micT = null;
  });
  bindMic($('#mic'), $('#answer'));
  bindMic($('#fu-mic'), $('#fu-text'));
}

$('#evaluate').onclick = async () => {
  const text = $('#answer').value.trim(); if (!text) return;
  clearError();
  const btn = $('#evaluate'); btn.disabled = true; btn.innerHTML = `<span class="spin">◌</span> ${esc(t('reading'))}`;
  try {
    if (!sample) throw new Error('no sample');
    const r = await sample.json(
`You are a strict but encouraging ${L.english} teacher. A learner answered a speaking prompt; below is the text of their answer (it may come from speech-to-text, so ignore capitalisation and punctuation, and don't judge likely recognition errors harshly).

Prompt: ${topic[0]}
Learner's answer: """${text}"""

Reply with ONLY valid JSON of this exact shape:
{"grammarScore":0-100,"idiomScore":0-100,
 "strengths":["2-3 specific things done well"],
 "improvements":["2-3 specific corrections"],
 "corrected":"a corrected, more natural ${L.english} version of the answer",
 "grammarNotes":"concise explanation of grammar and word choice",
 "pronunciationNotes":"tips for pronouncing the trickiest words in THIS answer"}
grammarScore = grammar accuracy and relevance; idiomScore = how natural and native-like it sounds.
All feedback except "corrected" is written in ${feedbackLang()}.`, { cache: false });
    renderEval(r);
    $('#evaluation').scrollIntoView({ behavior: 'smooth', block: 'start' });
  } catch (err) { showError(errText(err)); }
  btn.textContent = t('getFeedback'); btn.disabled = !$('#answer').value.trim();
};
function scoreBar(label, v, cls) {
  const n = Math.max(0, Math.min(100, Math.round(+v || 0)));
  return `<div class="score"><div class="score-top"><span>${esc(label)}</span><span>${n}</span></div><div class="bar ${cls}"><i style="width:0" data-w="${n}"></i></div></div>`;
}
function renderEval(r) {
  lastEval = r;
  const li = (a) => (a || []).map((s) => `<li>${esc(s)}</li>`).join('');
  $('#evaluation').innerHTML = `<div class="stack rise">
    <div class="card stack">${scoreBar(t('grammar'), r.grammarScore, '')}${scoreBar(t('natural'), r.idiomScore, 'b2')}</div>
    <div class="card"><span class="label">${esc(t('good'))}</span><ul class="plain good">${li(r.strengths)}</ul></div>
    <div class="card"><span class="label">${esc(t('improve'))}</span><ul class="plain warn">${li(r.improvements)}</ul></div>
    <div class="card"><span class="label">${esc(t('better'))}</span><div class="brow"><p class="quote">${esc(r.corrected)}</p>${speakBtn('fix', r.corrected)}</div></div>
    <div class="card"><span class="label">${esc(t('grammarNotes'))}</span><p style="font-weight:500">${esc(r.grammarNotes)}</p>
      <div style="height:14px"></div><span class="label">${esc(t('pronTips'))}</span><p style="font-weight:500">${esc(r.pronunciationNotes)}</p></div></div>`;
  requestAnimationFrame(() => document.querySelectorAll('.bar i').forEach((i) => { i.style.width = i.dataset.w + '%'; }));
}

/* ================= 设置 ================= */
function renderSettings() {
  $('#lang-list-settings').innerHTML = langButtons();
  $('#speak-list-settings').innerHTML = speakButtons();
  const done = Object.entries(progress).filter(([k]) => k.startsWith(langId + ':'));
  const total = done.reduce((a, [, v]) => a + v, 0);
  $('#stats').textContent = total ? t('stats', L, total, done.length) : t('noStats', L);
}
$('#lang-list-settings').onclick = (e) => { const b = e.target.closest('[data-lang]'); if (b) setLang(b.dataset.lang); };
$('#speak-list-settings').onclick = (e) => { const b = e.target.closest('[data-speak]'); if (b) setSpeak(b.dataset.speak); };
$('#reset').onclick = () => { Object.keys(progress).forEach((k) => { if (k.startsWith(langId + ':')) delete progress[k]; }); store.set('sk-progress2', progress); delete mine[langId]; store.set('sk-mine', mine); delete diary[langId]; saveDiary(); renderHome(); renderSettings(); };
function renderCaps() {
  $('#caps').innerHTML = [
    [t('capAI'), sample ? (WEB ? (getCfg().key ? t('viaKey') : t('needKey')) : t('ok')) : t('needClaude')],
    [t('capTTS'), tts ? t('ttsClaude') : ('speechSynthesis' in window ? t('ttsSys') : t('na'))],
    [t('capMic'), dict ? (WEB ? t('micWeb') : t('ok')) : t('micNa')],
  ].map(([k, v]) => `<li><b>${esc(k)}</b>：${esc(v)}</li>`).join('').replace(/：/g, UI === 'en' ? ': ' : '：');
  document.body.classList.toggle('no-voice', !tts && !('speechSynthesis' in window));
}

/* ================= Web 版适配层 =================
   在 claude.ai 里打开时用 Claude 的内置能力；独立部署时：
   AI → the browser calls Claude or OpenAI directly with the visitor's own key; read aloud → speechSynthesis; dictation → SpeechRecognition */
function parseJSONLoose(text) {
  const s = String(text || '').replace(/^\s*```(?:json)?/i, '').replace(/```\s*$/, '');
  try { return JSON.parse(s); } catch {}
  const i = s.indexOf('{'), j = s.lastIndexOf('}');
  if (i >= 0 && j > i) { try { return JSON.parse(s.slice(i, j + 1)); } catch {} }
  throw { code: 'bad_output' };
}
/* Bring your own key: the browser calls Claude or OpenAI directly. The key decides the provider. */
const SYSTEM = 'You are the language-coach engine of a learning app. Always reply with only valid JSON, no markdown fences, no extra text.';
const MODELS = [['claude-haiku-5-5', 'mHaiku'], ['claude-sonnet-5-5', 'mSonnet'], ['claude-opus-5-5', 'mOpus'], ['gpt-6-luna', 'mLuna'], ['gpt-6.2-sol', 'mSol'], ['gpt-6.2-astra', 'mAstra']];
const keyProvider = (k) => (/^sk-ant-/.test(k || '') ? 'anthropic' : 'openai');
const modelProvider = (m) => (/^gpt-|^o\d/.test(m || '') ? 'openai' : 'anthropic');
function getCfg() { const c = store.get('sk-api', {}) || {}; return { key: c.key || '', model: c.model || 'claude-sonnet-5-5' }; }
function setCfg(c) { store.set('sk-api', c); }
function renderModels() {
  const sel = $('#api-model'); if (!sel) return; const cur = getCfg().model;
  sel.innerHTML = MODELS.map(([v, k]) => `<option value="${v}"${v === cur ? ' selected' : ''}>${esc(t(k))}</option>`).join('');
}
/* no key yet: close whatever is open and take the visitor straight to the key field */
function goKey() {
  $('#sheet-root').innerHTML = '';
  if (!$('#lesson-screen').classList.contains('hidden')) showLesson(false);
  if (!$('#card-screen').classList.contains('hidden')) hideCard();
  if (!$('#where-screen').classList.contains('hidden')) showWhere(false);
  switchTab('settings');
  setTimeout(() => { $('#key-card').scrollIntoView({ block: 'center' }); $('#key-msg').textContent = t('errNoKey'); $('#api-key').focus(); }, 50);
}
async function callAI(prompt, maxTokens = 3000) {
  const cfg = getCfg(); if (!cfg.key) { goKey(); throw { code: 'no_key' }; }
  const openai = keyProvider(cfg.key) === 'openai';
  const model = modelProvider(cfg.model) === (openai ? 'openai' : 'anthropic') ? cfg.model : (openai ? 'gpt-6-luna' : 'claude-haiku-5-5');
  let r;
  try {
    r = openai
      ? await fetch('https://api.openai.com/v1/chat/completions', { method: 'POST', headers: { 'content-type': 'application/json', authorization: 'Bearer ' + cfg.key },
          body: JSON.stringify({ model, max_completion_tokens: maxTokens + 2048, reasoning_effort: 'low', messages: [{ role: 'system', content: SYSTEM }, { role: 'user', content: prompt }] }) })
      : await fetch('https://api.anthropic.com/v1/messages', { method: 'POST', headers: { 'content-type': 'application/json', 'x-api-key': cfg.key, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' },
          body: JSON.stringify({ model, max_tokens: maxTokens, system: SYSTEM, messages: [{ role: 'user', content: prompt }] }) });
  } catch { throw { code: 'offline' }; }
  let body = null; try { body = await r.json(); } catch {}
  if (!r.ok) {
    const er = (body && body.error) || {}, m = er.message || '';
    if (r.status === 401 || r.status === 403) throw { code: 'bad_key' };
    if (er.code === 'insufficient_quota' || er.type === 'insufficient_quota' || /credit balance|billing|quota/i.test(m)) throw { code: 'no_credit' };
    if (r.status === 429) throw { code: 'rate_limited' };
    throw { code: 'server', message: m };
  }
  if (openai) { const c = body && body.choices && body.choices[0]; return String((c && c.message && c.message.content) || ''); }
  return ((body && body.content) || []).filter((x) => x.type === 'text').map((x) => x.text).join('');
}
const webSample = { async json(prompt) { return parseJSONLoose(await callAI(prompt)); } };
function webDictation() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return null;
  let rec = null, fPartial = () => {}, fFinal = () => {}, fState = () => {};
  return {
    onPartial(f) { fPartial = f; }, onFinal(f) { fFinal = f; }, onState(f) { fState = f; },
    start() {
      return new Promise((resolve, reject) => {
        rec = new SR(); rec.lang = L.locale; rec.interimResults = true; rec.continuous = true;
        rec.onstart = () => { fState({ state: 'listening' }); resolve(); };
        rec.onresult = (e) => {
          let interim = '';
          for (let i = e.resultIndex; i < e.results.length; i++) {
            const s = e.results[i][0].transcript;
            if (e.results[i].isFinal) fFinal({ text: s.trim() }); else interim += s;
          }
          if (interim) fPartial({ text: interim.trim() });
        };
        rec.onerror = (e) => {
          if (e.error === 'not-allowed' || e.error === 'service-not-allowed') reject({ code: 'not_granted' });
          else if (e.error !== 'no-speech' && e.error !== 'aborted') showError(t('errMic'));
        };
        rec.onend = () => { fState({ state: 'idle', reason: 'stopped' }); rec = null; };
        try { rec.start(); } catch (err) { reject(err); }
      });
    },
    stop() { return new Promise((resolve) => { if (!rec) return resolve(); const r = rec; r.addEventListener('end', () => resolve(), { once: true }); r.stop(); }); },
  };
}
if (WEB) {
  [['manifest', 'manifest.webmanifest'], ['icon', 'icons/favicon.png'], ['apple-touch-icon', 'icons/apple-touch-icon.png']].forEach(([rel, href]) => {
    const l = document.createElement('link'); l.rel = rel; l.href = href; document.head.appendChild(l);
  });
  $('#key-card').classList.remove('hidden');
  const keyMsg = (m) => { $('#key-msg').textContent = m || ''; };
  const saveKey = () => { const k = $('#api-key').value.trim(), c = getCfg(); setCfg({ key: k || c.key, model: $('#api-model').value }); $('#api-key').value = ''; applyUI(); renderCaps(); };
  $('#api-key').onchange = () => { saveKey(); keyMsg(''); };
  $('#api-model').onchange = saveKey;
  $('#key-test').onclick = async () => {
    saveKey(); if (!getCfg().key) return keyMsg(t('keyNone'));
    keyMsg(t('keyTesting'));
    try { await callAI('Reply with {"ok":true}', 20); keyMsg(t('keyOk')); } catch (e) { keyMsg(errText(e)); }
  };
  $('#key-clear').onclick = () => { setCfg({ key: '', model: getCfg().model }); applyUI(); renderCaps(); keyMsg(t('keyCleared')); };
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }
  if ('speechSynthesis' in window) speechSynthesis.getVoices();
}

/* ================= 首次引导 ================= */
function showOnboard(on) {
  $('#view-onboard').classList.toggle('hidden', !on);
  document.body.classList.toggle('onboarding', on);
  if (on) { VIEWS.forEach((x) => $('#view-' + x).classList.add('hidden')); obStep(1); }
  else switchTab('dialogue');
}
function obStep(n) {
  $('#ob-1').classList.toggle('hidden', n !== 1); $('#ob-2').classList.toggle('hidden', n !== 2);
  if (n === 1) $('#ob-speak').innerHTML = Object.entries(SPEAKS).map(([id, l]) => `<button type="button" data-ob-speak="${id}" class="${id === SPEAK ? 'on' : ''}"><span class="flag">${l.flag}</span><b>${esc(l.native)}</b></button>`).join('');
  if (n === 2) {
    $('#ob-back').textContent = t('obBack');
    $('#ob-learn-title').textContent = t('learnQ');
    $('#ob-langs').innerHTML = Object.entries(LANGS).filter(([id]) => id !== SPEAK).map(([id, l]) => `<button type="button" data-ob-lang="${id}">
      <span class="flag">${l.flag}</span><b>${esc(loc(l.name))}</b><span class="nat">${esc(l.native)}</span></button>`).join('');
  }
  window.scrollTo(0, 0);
}
$('#ob-speak').onclick = (e) => { const b = e.target.closest('[data-ob-speak]'); if (!b) return; setSpeak(b.dataset.obSpeak); obStep(2); };
$('#ob-back').onclick = () => obStep(1);
$('#ob-langs').onclick = (e) => {
  const b = e.target.closest('[data-ob-lang]'); if (!b) return;
  setLang(b.dataset.obLang); store.set('sk-onboarded', true); showOnboard(false);
};

/* ================= 启动 ================= */
applyUI(); renderHome(); showTopic(); resetEval(); renderCaps();
if (!store.get('sk-onboarded', false) || !store.get('sk-speak', null)) showOnboard(true);
(async () => {
  if (!WEB) {
    try { sample = await claude.use('sample'); } catch {}
    try { tts = await claude.use('tts'); } catch {}
    try { dict = await claude.use('dictation'); } catch {}
    if (tts) tts.onState(({ state }) => { if (state === 'idle') setPlaying(null); });
  } else {
    sample = webSample;
    dict = webDictation();
  }
  setupDictation();
  renderCaps();
})();
</script>
