<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Day 1 · Christmas Countdown</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:#f3b9c3;color:#8a1226;font-family:Inter,sans-serif;padding:16px}
.eyebrow{font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;font-weight:600;margin:0}
h1{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:clamp(2.6rem,8vw,4.6rem);line-height:.95;margin:8px 0 32px;color:#c8102e}
#boxes{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.box{width:110px;padding:18px 0 14px;border-radius:10px;background:#c8102e;box-shadow:4px 5px 0 #0002;color:#fff}
.box b{display:block;font-family:"Barlow Condensed",sans-serif;font-size:3.6rem;line-height:1;font-variant-numeric:tabular-nums}
.box span{font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;opacity:.85}
#msg{margin-top:28px}
a{margin-top:30px;color:inherit}
</style>
</head>
<body>
<p class="eyebrow">Day 1</p>
<h1>Until Christmas<br>morning</h1>
<div id="boxes">
  <div class="box"><b id="d">0</b><span>Days</span></div>
  <div class="box"><b id="h">00</b><span>Hours</span></div>
  <div class="box"><b id="m">00</b><span>Minutes</span></div>
  <div class="box"><b id="s">00</b><span>Seconds</span></div>
</div>
<div id="msg"></div>
<a href="../../">← Back to calendar</a>
<script>
const now = new Date();
let target = new Date(now.getFullYear(), 11, 25);
if (now > target) target = new Date(now.getFullYear() + 1, 11, 25);
const pad = v => String(v).padStart(2, '0');
function tick() {
  const diff = target - new Date();
  d.textContent = Math.floor(diff / 864e5);
  h.textContent = pad(Math.floor(diff / 36e5) % 24);
  m.textContent = pad(Math.floor(diff / 6e4) % 60);
  s.textContent = pad(Math.floor(diff / 1e3) % 60);
  msg.textContent = Math.ceil(diff / 864e5) + ' sleeps to go. Time to make a wish. 🎁';
}
tick(); setInterval(tick, 1000);
</script>
</body>
</html>
