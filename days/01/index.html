<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Day 1 · Christmas Countdown</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#f6efe0;font-family:Inter,sans-serif;
 background:radial-gradient(1000px 500px at 50% -10%,#1c4a3b,transparent 60%),linear-gradient(180deg,#0a1f1a,#06110e)}
.eyebrow{font-size:.8rem;letter-spacing:.18em;text-transform:uppercase;color:#e9c46a;margin:0}
h1{font-family:Fraunces,serif;font-weight:800;font-size:clamp(2rem,6vw,3.4rem);margin:12px 0 32px}
#boxes{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;padding:0 16px}
.box{width:110px;padding:20px 0;border-radius:16px;background:linear-gradient(155deg,#d62839,#8f1424);border:1px solid #ffd9a055;box-shadow:0 10px 30px -8px #d6283980}
.box b{display:block;font-family:Fraunces,serif;font-size:3rem;color:#e9c46a;font-variant-numeric:tabular-nums}
.box span{font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;opacity:.85}
#msg{margin-top:28px;color:#a9b8ae}
a{margin-top:36px;color:#a9b8ae;text-decoration:none;border-bottom:1px solid #ffffff30}
a:hover{color:#e9c46a}
</style>
</head>
<body>
<p class="eyebrow">Day 1</p>
<h1>Until Christmas morning</h1>
<div id="boxes">
  <div class="box"><b id="d">0</b><span>Days</span></div>
  <div class="box"><b id="h">00</b><span>Hours</span></div>
  <div class="box"><b id="m">00</b><span>Minutes</span></div>
  <div class="box"><b id="s">00</b><span>Seconds</span></div>
</div>
<div id="msg"></div>
<a href="../../">← Back to calendar</a>
<script>
const now = new Date();
let target = new Date(now.getFullYear(), 11, 25);
if (now > target) target = new Date(now.getFullYear() + 1, 11, 25);
const pad = v => String(v).padStart(2, '0');
function tick() {
  const diff = target - new Date();
  d.textContent = Math.floor(diff / 864e5);
  h.textContent = pad(Math.floor(diff / 36e5) % 24);
  m.textContent = pad(Math.floor(diff / 6e4) % 60);
  s.textContent = pad(Math.floor(diff / 1e3) % 60);
  msg.textContent = Math.ceil(diff / 864e5) + ' sleeps to go. Time to make a wish. 🎁';
}
tick(); setInterval(tick, 1000);
</script>
</body>
</html>
