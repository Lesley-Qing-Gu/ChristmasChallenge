<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Day 1 · Christmas Countdown</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:#e60012;color:#fff;font-family:Inter,sans-serif;padding:16px}
.eyebrow{font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:1.2rem;letter-spacing:.08em;margin:0}
h1{font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:clamp(2.8rem,8vw,5rem);line-height:.92;margin:8px 0 34px}
#boxes{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.box{position:relative;width:118px;height:110px;border-radius:5px;background:#fff;color:#e60012;overflow:hidden}
.box::after{content:"";position:absolute;left:0;right:0;bottom:0;height:45%;background:radial-gradient(#e60012 1.2px,transparent 1.6px) 0 0/6px 6px;-webkit-mask:linear-gradient(transparent,#000);mask:linear-gradient(transparent,#000);opacity:.5}
.box b{position:absolute;top:8px;left:10px;font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:3.4rem;line-height:1;font-variant-numeric:tabular-nums}
.box span{position:absolute;top:10px;right:10px;font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:.8rem;letter-spacing:.08em}
#msg{margin-top:30px;font-size:.95rem}
a{margin-top:28px;color:#fff;font-size:.9rem}
</style>
</head>
<body>
<p class="eyebrow">DAY 01 · NOV 8</p>
<h1>Until Christmas<br>morning</h1>
<div id="boxes">
  <div class="box"><b id="d">0</b><span>DAYS</span></div>
  <div class="box"><b id="h">00</b><span>HRS</span></div>
  <div class="box"><b id="m">00</b><span>MIN</span></div>
  <div class="box"><b id="s">00</b><span>SEC</span></div>
</div>
<div id="msg"></div>
<a href="../../">← Back to calendar</a>
<script>
const now = new Date();
let target = new Date(now.getFullYear(), 11, 25);
if (now > target) target = new Date(now.getFullYear() + 1, 11, 25);
const pad = v => String(v).padStart(2, '0');
function tick() {
  const diff = target - new Date();
  d.textContent = Math.floor(diff / 864e5);
  h.textContent = pad(Math.floor(diff / 36e5) % 24);
  m.textContent = pad(Math.floor(diff / 6e4) % 60);
  s.textContent = pad(Math.floor(diff / 1e3) % 60);
  msg.textContent = Math.ceil(diff / 864e5) + ' sleeps to go. Time to make a wish. 🎁';
}
tick(); setInterval(tick, 1000);
</script>
</body>
</html>
