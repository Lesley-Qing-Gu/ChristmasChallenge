<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>24 Days of Shipping · Christmas Challenge</title>
<meta name="description" content="One small feature shipped every 2 days, from Nov 8 to Dec 24.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Caveat:wght@600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="poster">
  <div class="dots" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
  <header>
    <div>
      <p class="kicker">Christmas Challenge Calendar</p>
      <h1>24 Days of<br>Shipping</h1>
    </div>
    <div class="year">
      <b>2026</b>
      <span>Nov 8 → Dec 24<br>one feature every 2 days</span>
    </div>
  </header>

  <div class="house">
    <div class="chimney"></div>
    <div class="roof"><span>Merry Christmas</span></div>
    <main id="grid"></main>
  </div>

  <div class="foot">
    <span id="progress"></span>
    <span>Hover a door to open it</span>
    <a href="https://github.com/Lesley-Qing-Gu/ChristmasChallenge">Source on GitHub ↗</a>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
